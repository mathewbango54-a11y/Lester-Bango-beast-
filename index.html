<script>

/* =========================================================
   BANGO V30
   SOCCER PREDICTION ENGINE
   ========================================================= */

const API =
"https://www.thesportsdb.com/api/v1/json/123";

const DB_KEY =
"bango_v30_team_database";

const CACHE_KEY =
"bango_v30_team_id_cache";

const EVENT_KEY =
"bango_v30_processed_events";

let TEAM_DB = loadLocal(DB_KEY,{});
let TEAM_IDS = loadLocal(CACHE_KEY,{});
let PROCESSED = loadLocal(EVENT_KEY,{});

let ALL = [];
let CURRENT_FILTER = "all";

let REQUESTS = 0;


/* =========================================================
   LOCAL STORAGE
   ========================================================= */

function loadLocal(key,fallback){

  try{

    const x = localStorage.getItem(key);

    if(!x) return fallback;

    return JSON.parse(x);

  }catch(e){

    return fallback;

  }

}

function saveLocal(key,value){

  try{

    localStorage.setItem(
      key,
      JSON.stringify(value)
    );

  }catch(e){}

}


/* =========================================================
   HELPERS
   ========================================================= */

function sleep(ms){

  return new Promise(
    resolve=>setTimeout(resolve,ms)
  );

}

async function getJSON(url){

  try{

    REQUESTS++;

    const response =
      await fetch(url);

    if(!response.ok)
      throw new Error(
        "HTTP "+response.status
      );

    return await response.json();

  }catch(e){

    return null;

  }

}

function cleanName(name){

  return String(name||"")
    .toLowerCase()
    .replace(/\b(fc|afc|cf|sc|ac|club)\b/g,"")
    .replace(/[^a-z0-9]/g,"")
    .trim();

}

function clamp(x,min,max){

  return Math.max(
    min,
    Math.min(max,x)
  );

}

function pct(x){

  return (
    clamp(x,0,1)*100
  ).toFixed(1);

}

function poisson(k,lambda){

  if(lambda<=0)
    return k===0 ? 1 : 0;

  let factorial=1;

  for(let i=2;i<=k;i++)
    factorial*=i;

  return (
    Math.exp(-lambda) *
    Math.pow(lambda,k) /
    factorial
  );

}


/* =========================================================
   TEAM DATABASE
   ========================================================= */

function newTeam(name,id){

  return {

    name:name,
    id:id||null,

    elo:1500,

    matches:0,

    wins:0,
    draws:0,
    losses:0,

    goalsFor:0,
    goalsAgainst:0,

    homeMatches:0,
    homeGF:0,
    homeGA:0,

    awayMatches:0,
    awayGF:0,
    awayGA:0,

    recent:[],

    lastUpdated:null

  };

}

function getTeam(name,id){

  const key =
    cleanName(name);

  if(!TEAM_DB[key]){

    TEAM_DB[key] =
      newTeam(name,id);

  }

  if(id)
    TEAM_DB[key].id=id;

  if(name)
    TEAM_DB[key].name=name;

  return TEAM_DB[key];

}


/* =========================================================
   TEAM SEARCH
   ========================================================= */

async function resolveTeamId(name){

  const key =
    cleanName(name);

  if(TEAM_IDS[key])
    return TEAM_IDS[key];

  const url =
    API+
    "/searchteams.php?t="+
    encodeURIComponent(name);

  const data =
    await getJSON(url);

  if(
    data &&
    data.teams &&
    data.teams.length
  ){

    const team =
      data.teams[0];

    if(team.idTeam){

      TEAM_IDS[key]=
        team.idTeam;

      saveLocal(
        CACHE_KEY,
        TEAM_IDS
      );

      return team.idTeam;

    }

  }

  return null;

}


/* =========================================================
   ELO
   ========================================================= */

function expectedElo(home,away){

  return 1 /
    (
      1 +
      Math.pow(
        10,
        (
          away-
          (home+55)
        )/400
      )
    );

}

function updateElo(
  homeTeam,
  awayTeam,
  hg,
  ag
){

  const oldHome =
    homeTeam.elo;

  const oldAway =
    awayTeam.elo;

  const expectedHome =
    expectedElo(
      oldHome,
      oldAway
    );

  let actualHome=0.5;

  if(hg>ag)
    actualHome=1;

  if(hg<ag)
    actualHome=0;

  let margin =
    Math.abs(hg-ag);

  let multiplier =
    margin>=2 ? 1.15 : 1;

  const K=20;

  homeTeam.elo =
    oldHome+
    K*
    multiplier*
    (
      actualHome-
      expectedHome
    );

  awayTeam.elo =
    oldAway+
    K*
    multiplier*
    (
      (1-actualHome)-
      (1-expectedHome)
    );

}


/* =========================================================
   PROCESS COMPLETED MATCH
   ========================================================= */

function processMatch(ev){

  if(!ev)
    return;

  const eventId =
    ev.idEvent;

  if(!eventId)
    return;

  if(PROCESSED[eventId])
    return;

  const hg =
    parseInt(ev.intHomeScore);

  const ag =
    parseInt(ev.intAwayScore);

  if(
    Number.isNaN(hg) ||
    Number.isNaN(ag)
  )
    return;

  const home =
    getTeam(
      ev.strHomeTeam,
      ev.idHomeTeam
    );

  const away =
    getTeam(
      ev.strAwayTeam,
      ev.idAwayTeam
    );

  /* HOME */

  home.matches++;

  home.goalsFor+=hg;
  home.goalsAgainst+=ag;

  home.homeMatches++;
  home.homeGF+=hg;
  home.homeGA+=ag;

  /* AWAY */

  away.matches++;

  away.goalsFor+=ag;
  away.goalsAgainst+=hg;

  away.awayMatches++;
  away.awayGF+=ag;
  away.awayGA+=hg;

  /* RESULT */

  if(hg>ag){

    home.wins++;
    away.losses++;

  }else if(hg===ag){

    home.draws++;
    away.draws++;

  }else{

    home.losses++;
    away.wins++;

  }

  /* FORM */

  home.recent.unshift(
    hg>ag ? "W":
    hg===ag ? "D":"L"
  );

  away.recent.unshift(
    ag>hg ? "W":
    ag===hg ? "D":"L"
  );

  home.recent =
    home.recent.slice(0,10);

  away.recent =
    away.recent.slice(0,10);

  /* ELO */

  updateElo(
    home,
    away,
    hg,
    ag
  );

  home.lastUpdated =
    new Date().toISOString();

  away.lastUpdated =
    new Date().toISOString();

  PROCESSED[eventId]=true;

}


/* =========================================================
   FORM
   ========================================================= */

function formPoints(team){

  if(!team.recent.length)
    return 0.5;

  let points=0;

  team.recent.forEach(r=>{

    if(r==="W") points+=3;
    else if(r==="D") points+=1;

  });

  return points /
    (
      team.recent.length*3
    );

}


/* =========================================================
   RECENT FORM TREND
   ========================================================= */

function trend(team){

  if(team.recent.length<4)
    return 0;

  const recent =
    team.recent.slice(0,3);

  const older =
    team.recent.slice(3,6);

  function score(arr){

    if(!arr.length)
      return 0.5;

    let p=0;

    arr.forEach(r=>{

      if(r==="W") p+=1;
      else if(r==="D") p+=0.5;

    });

    return p/arr.length;

  }

  return clamp(
    score(recent)-
    score(older),
    -0.5,
    0.5
  );

}


/* =========================================================
   STRENGTH VALUES
   ========================================================= */

function attackStrength(team){

  if(!team.matches)
    return 1;

  const gf =
    team.goalsFor/
    team.matches;

  return clamp(
    gf/1.35,
    0.55,
    1.65
  );

}

function defenceStrength(team){

  if(!team.matches)
    return 1;

  const ga =
    team.goalsAgainst/
    team.matches;

  return clamp(
    1.45/
    Math.max(0.25,ga),
    0.55,
    1.65
  );

}

function homeAttack(team){

  if(!team.homeMatches)
    return attackStrength(team);

  const gf =
    team.homeGF/
    team.homeMatches;

  return clamp(
    gf/1.45,
    0.55,
    1.65
  );

}

function homeDefence(team){

  if(!team.homeMatches)
    return defenceStrength(team);

  const ga =
    team.homeGA/
    team.homeMatches;

  return clamp(
    1.40/
    Math.max(0.25,ga),
    0.55,
    1.65
  );

}

function awayAttack(team){

  if(!team.awayMatches)
    return attackStrength(team);

  const gf =
    team.awayGF/
    team.awayMatches;

  return clamp(
    gf/1.25,
    0.55,
    1.65
  );

}

function awayDefence(team){

  if(!team.awayMatches)
    return defenceStrength(team);

  const ga =
    team.awayGA/
    team.awayMatches;

  return clamp(
    1.50/
    Math.max(0.25,ga),
    0.55,
    1.65
  );

}


/* =========================================================
   XG MODEL
   ========================================================= */

function expectedGoals(
  home,
  away
){

  const hAttack =
    homeAttack(home);

  const hDef =
    homeDefence(home);

  const aAttack =
    awayAttack(away);

  const aDef =
    awayDefence(away);

  let homeXG =
    1.42*
    hAttack*
    aDef;

  let awayXG =
    1.08*
    aAttack*
    hDef;

  /* ELO adjustment */

  const eloDiff =
    (
      home.elo+
      55-
      away.elo
    )/400;

  homeXG *=
    1+
    clamp(
      eloDiff*0.20,
      -0.12,
      0.12
    );

  awayXG *=
    1-
    clamp(
      eloDiff*0.10,
      -0.08,
      0.08
    );

  /* FORM */

  const hf =
    formPoints(home);

  const af =
    formPoints(away);

  homeXG *=
    1+
    clamp(
      (hf-0.5)*0.18,
      -0.09,
      0.09
    );

  awayXG *=
    1+
    clamp(
      (af-0.5)*0.18,
      -0.09,
      0.09
    );

  /* TREND */

  homeXG *=
    1+
    clamp(
      trend(home)*0.08,
      -0.04,
      0.04
    );

  awayXG *=
    1+
    clamp(
      trend(away)*0.08,
      -0.04,
      0.04
    );

  return {

    home:
      clamp(
        homeXG,
        0.25,
        4.5
      ),

    away:
      clamp(
        awayXG,
        0.20,
        4.0
      )

  };

}


/* =========================================================
   POISSON PREDICTION
   ========================================================= */

function calculateProbabilities(
  homeXG,
  awayXG
){

  let homeWin=0;
  let draw=0;
  let awayWin=0;

  let over15=0;
  let over25=0;

  let btts=0;

  for(
    let h=0;
    h<=7;
    h++
  ){

    for(
      let a=0;
      a<=7;
      a++
    ){

      const p =
        poisson(h,homeXG)*
        poisson(a,awayXG);

      if(h>a)
        homeWin+=p;

      else if(h===a)
        draw+=p;

      else
        awayWin+=p;

      if(h+a>=2)
        over15+=p;

      if(h+a>=3)
        over25+=p;

      if(h>=1 && a>=1)
        btts+=p;

    }

  }

  return {

    homeWin,
    draw,
    awayWin,
    over15,
    over25,
    btts

  };

}


/* =========================================================
   SAMPLE CONFIDENCE
   ========================================================= */

function sampleQuality(
  home,
  away
){

  const h =
    Math.min(
      home.matches,
      20
    )/20;

  const a =
    Math.min(
      away.matches,
      20
    )/20;

  return (
    h+a
  )/2;

}


/* =========================================================
   MODEL PICK
   ========================================================= */

function choosePick(
  p,
  quality
){

  if(quality<0.30)
    return {
      text:"SKIP — insufficient team data",
      confidence:quality
    };

  const candidates=[

    {
      name:"HOME WIN",
      p:p.homeWin
    },

    {
      name:"DRAW",
      p:p.draw
    },

    {
      name:"AWAY WIN",
      p:p.awayWin
    },

    {
      name:"OVER 1.5",
      p:p.over15
    },

    {
      name:"OVER 2.5",
      p:p.over25
    },

    {
      name:"BTTS",
      p:p.btts
    }

  ];

  candidates.sort(
    (a,b)=>b.p-a.p
  );

  const top =
    candidates[0];

  let threshold=0.62;

  if(
    top.name==="DRAW" ||
    top.name==="HOME WIN" ||
    top.name==="AWAY WIN"
  )
    threshold=0.54;

  if(top.p < threshold){

    return {

      text:"SKIP — no strong statistical edge",

      confidence:
        top.p*quality

    };

  }

  return {

    text:
      top.name+
      " "+
      pct(top.p)+"%",

    confidence:
      top.p*quality

  };

}


/* =========================================================
   PREDICT MATCH
   ========================================================= */

function predictMatch(game){

  const home =
    getTeam(
      game.home,
      game.homeId
    );

  const away =
    getTeam(
      game.away,
      game.awayId
    );

  const xg =
    expectedGoals(
      home,
      away
    );

  const probabilities =
    calculateProbabilities(
      xg.home,
      xg.away
    );

  const quality =
    sampleQuality(
      home,
      away
    );

  const pick =
    choosePick(
      probabilities,
      quality
    );

  return {

    home,
    away,

    homeXG:xg.home,
    awayXG:xg.away,

    ...probabilities,

    quality,

    pick

  };

}


/* =========================================================
   ESPN FIXTURE SOURCE
   ========================================================= */

async function loadESPN(){

  const url =
  "https://site.api.espn.com/apis/site/v2/sports/soccer/scoreboard";

  const data =
    await getJSON(url);

  if(!data || !data.events)
    return [];

  const games=[];

  data.events.forEach(ev=>{

    const comp =
      ev.competitions &&
      ev.competitions[0];

    if(!comp)
      return;

    const h =
      comp.competitors.find(
        x=>x.homeAway==="home"
      );

    const a =
      comp.competitors.find(
        x=>x.homeAway==="away"
      );

    if(!h || !a)
      return;

    const status =
      comp.status?.type;

    const state =
      status?.state || "";

    const date =
      new Date(ev.date);

    const now =
      new Date();

    const isLive =
      state==="in";

    const isUpcoming =
      state==="pre";

    const isFinished =
      state==="post";

    if(isFinished)
      return;

    games.push({

      id:
        "espn_"+ev.id,

      league:
        ev.league?.name ||
        "Soccer",

      home:
        h.team.displayName,

      away:
        a.team.displayName,

      homeId:null,
      awayId:null,

      time:date,

      isLive,
      isUpcoming,

      score:
        (
          h.score ||
          "0"
        )+
        " - "+
        (
          a.score ||
          "0"
        ),

      clock:
        status?.detail ||
        state,

      source:"ESPN"

    });

  });

  return games;

}


/* =========================================================
   SPORTSDb TODAY
   ========================================================= */

async function loadSportsDB(){

  const today =
    new Date();

  const dates=[];

  for(let i=-1;i<=1;i++){

    const d =
      new Date(today);

    d.setDate(
      d.getDate()+i
    );

    dates.push(
      d.toISOString()
       .slice(0,10)
    );

  }

  const all=[];

  for(
    const date of dates
  ){

    const data =
      await getJSON(
        API+
        "/eventsday.php?d="+
        date+
        "&s=Soccer"
      );

    if(
      !data ||
      !data.events
    )
      continue;

    data.events.forEach(ev=>{

      const h =
        ev.strHomeTeam;

      const a =
        ev.strAwayTeam;

      if(!h || !a)
        return;

      const dt =
        new Date(
          (
            ev.dateEvent+
            "T"+
            (
              ev.strTime ||
              "00:00:00"
            )
          )
        );

      const now =
        new Date();

      const status =
        String(
          ev.strStatus||""
        ).toLowerCase();

      const isFinished =
        ev.intHomeScore!==null &&
        ev.intAwayScore!==null &&
        (
          status.includes("ft") ||
          status.includes("finished") ||
          dt<now
        );

      if(isFinished)
        return;

      const isLive =
        status.includes("live") ||
        status==="ht" ||
        status.includes("'");

      all.push({

        id:
          "sdb_"+ev.idEvent,

        league:
          ev.strLeague ||
          "Soccer",

        home:h,
        away:a,

        homeId:
          ev.idHomeTeam ||
          null,

        awayId:
          ev.idAwayTeam ||
          null,

        time:dt,

        isLive,

        isUpcoming:
          dt>now &&
          !isLive,

        score:
          (
            ev.intHomeScore ??
            0
          )+
          " - "+
          (
            ev.intAwayScore ??
            0
          ),

        clock:
          ev.strStatus ||
          "Scheduled",

        source:"TheSportsDB"

      });

    });

  }

  return all;

}


/* =========================================================
   DEDUPLICATE
   ========================================================= */

function dedupe(games){

  const map={};

  games.forEach(g=>{

    const key =
      cleanName(g.home)+
      "_"+
      cleanName(g.away);

    if(!map[key]){

      map[key]=g;

    }else{

      /*
       Prefer SportsDB when it provides IDs,
       because those IDs can feed the
       persistent team database.
      */

      if(
        g.homeId ||
        g.awayId
      ){

        map[key]=g;

      }

    }

  });

  return Object.values(map);

}


/* =========================================================
   ENRICH TEAM DATA
   ========================================================= */

async function enrichTeams(games){

  const unique={};

  games.forEach(g=>{

    const h=
      cleanName(g.home);

    const a=
      cleanName(g.away);

    unique[h]={
      name:g.home,
      id:g.homeId
    };

    unique[a]={
      name:g.away,
      id:g.awayId
    };

  });

  const teams =
    Object.values(unique);

  /*
   * Resolve IDs only where necessary.
   * Free API is rate limited, so keep requests controlled.
   */

  for(
    const t of teams
  ){

    const key=
      cleanName(t.name);

    if(
      t.id &&
      !TEAM_IDS[key]
    ){

      TEAM_IDS[key]=
        t.id;

    }

    if(
      !TEAM_IDS[key]
    ){

      await resolveTeamId(
        t.name
      );

      await sleep(120);

    }

  }

  saveLocal(
    CACHE_KEY,
    TEAM_IDS
  );

  /*
   * Fetch previous matches for
   * teams with IDs.
   *
   * We limit this to the teams
   * actually appearing today.
   */

  let count=0;

  for(
    const t of teams
  ){

    if(count>=20)
      break;

    const key=
      cleanName(t.name);

    const id=
      t.id ||
      TEAM_IDS[key];

    if(!id)
      continue;

    const data =
      await getJSON(
        API+
        "/eventslast.php?id="+
        id
      );

    if(
      data &&
      data.results
    ){

      data.results.forEach(
        processMatch
      );

    }

    count++;

    /*
     * Keep under free API limits.
     */

    await sleep(120);

  }

  saveLocal(
    DB_KEY,
    TEAM_DB
  );

  saveLocal(
    EVENT_KEY,
    PROCESSED
  );

}


/* =========================================================
   LOAD EVERYTHING
   ========================================================= */

async function loadAll(){

  const status =
    document.getElementById(
      "status"
    );

  status.innerHTML =
    "🔄 Loading current soccer fixtures...";

  REQUESTS=0;

  try{

    const [
      espn,
      sportsdb
    ] =
      await Promise.all([
        loadESPN(),
        loadSportsDB()
      ]);

    let games =
      dedupe([
        ...espn,
        ...sportsdb
      ]);

    /*
     * Limit enrichment to the
     * most relevant games.
     */

    games =
      games
      .sort(
        (a,b)=>
          Number(b.isLive)-
          Number(a.isLive)
      )
      .slice(0,30);

    status.innerHTML =
      "🧠 Updating persistent team-strength database...";

    await enrichTeams(
      games
    );

    games.forEach(g=>{

      g.prediction =
        predictMatch(g);

    });

    ALL=games;

    status.innerHTML =
      "✅ Model ready — "+
      ALL.length+
      " current matches | "+
      Object.keys(TEAM_DB).length+
      " teams in database | "+
      REQUESTS+
      " API requests";

    render();

  }catch(e){

    console.error(e);

    status.innerHTML =
      '<span class="error">'+
      "Data loading error. Refresh and try again."+
      "</span>";

  }

}


/* =========================================================
   RENDER
   ========================================================= */

function render(){

  let list =
    [...ALL];

  if(
    CURRENT_FILTER==="live"
  ){

    list =
      list.filter(
        g=>g.isLive
      );

  }

  if(
    CURRENT_FILTER==="today"
  ){

    list =
      list.filter(
        g=>
          !g.isLive &&
          !g.isUpcoming
      );

  }

  if(
    CURRENT_FILTER==="upcoming"
  ){

    list =
      list.filter(
        g=>g.isUpcoming
      );

  }

  document.getElementById(
    "c-all"
  ).innerText=
    ALL.length;

  document.getElementById(
    "c-live"
  ).innerText=
    ALL.filter(
      g=>g.isLive
    ).length;

  document.getElementById(
    "c-today"
  ).innerText=
    ALL.filter(
      g=>
        !g.isLive &&
        !g.isUpcoming
    ).length;

  document.getElementById(
    "c-up"
  ).innerText=
    ALL.filter(
      g=>g.isUpcoming
    ).length;

  const box =
    document.getElementById(
      "games"
    );

  if(!list.length){

    box.innerHTML=
      `
      <div class="card">
        <div style="text-align:center;color:#777">
          No matches in this category right now.
        </div>
      </div>
      `;

    return;

  }

  box.innerHTML =
    list.map(
      renderGame
    ).join("");

}

        </div>

        <div class="metric">
          DRAW:
          <b>${pct(p.draw)}%</b>
        </div>

        <div class="metric">
          AWAY WIN:
          <b>${pct(p.awayWin)}%</b>
        </div>

        <div class="metric">
          OVER 1.5:
          <b>${pct(p.over15)}%</b>
        </div>

        <div class="metric">
          OVER 2.5:
          <b>${pct(p.over25)}%</b>
        </div>

        <div class="metric">
          BTTS:
          <b>${pct(p.btts)}%</b>
        </div>

      </div>


      <div class="pick ${
        p.pick.text.startsWith("SKIP")
          ?"skip":""
      }">

        🎯 ${escapeHTML(p.pick.text)}

      </div>


      <div class="evidence">

        Database:

        ${h.matches} matches —
        ${a.matches} matches

        <br>

        Elo:
        ${Math.round(h.elo)}
        vs
        ${Math.round(a.elo)}

        <br>

        Attack:
        ${attackStrength(h).toFixed(2)}
        vs
        ${attackStrength(a).toFixed(2)}

        <br>

        ${defenceStrength(h).toFixed(2)}
        vs
        ${defenceStrength(a).toFixed(2)}

        <br>

        ${pct(p.quality)}%

        ${a.name} form:
        ${formHTML(a)}

    </div>


    <div class="buttons">

      <button
        class="btn"
        onclick="copyPrediction('${escapeAttr(g.home)}','${escapeAttr(g.away)}')"

/* =========================================================
   FORM HTML
   ========================================================= */

function formHTML(team){

  if(
    !team.recent ||
    !team.recent.length
  )
    return "N/A";

  return `
    <span class="form">
      ${
        team.recent
        .slice(0,5)
        .map(
          r=>
            `<span class="${r}">
              ${r}
            </span>`
        )
        .join("")
      }
    </span>
  `;

}

/* =========================================================
   TEAM VIEW
   ========================================================= */

function showTeam(name){

    TEAM_DB[
      cleanName(name)
    ];

    return;

    name+
    "\n\n"+

    "\n"+
    "W-D-L: "+

    "-"+
    team.draws+
    "-"+
    team.losses+
    "\n"+
    "Goals For: "+
    team.goalsFor+
    "\n"+
    "Goals Against: "+
    team.goalsAgainst+

/* =========================================================
   RESET DATABASE
   ========================================================= */

function resetDatabase(){

  const yes =
    confirm(
      "Reset the BANGO V30 learned team database?"
    );

  if(!yes)
    return;

  localStorage.removeItem(
    DB_KEY
  );

  localStorage.removeItem(
    CACHE_KEY
  );

  localStorage.removeItem(
    EVENT_KEY
  );

  TEAM_DB={};
  TEAM_IDS={};
  PROCESSED={};

  alert(
    "Database reset. Reloading..."
  );

  location.reload();

}


/* =========================================================
   FILTER
   ========================================================= */

function setFilter(
  filter,
  button
){

  CURRENT_FILTER=
    filter;

  document
    .querySelectorAll(".tab")
    .forEach(
      x=>x.classList.remove(
        "active"
      )
    );

  if(button)
    button.classList.add(
      "active"
    );

  if(
    filter==="database"
  ){

    showDatabase();
    return;

  }

  document.getElementById(
    "games"
  ).style.display="block";

  document.getElementById(
    "database"
  ).style.display="none";

  render();

}


/* =========================================================
   COPY
   ========================================================= */

function copyPrediction(
  home,
  away
){

  const key =
    cleanName(home);

  const game =
    ALL.find(
      g=>
        cleanName(g.home)===key &&
        cleanName(g.away)===
          cleanName(away)
    );

  if(!game)
    return;

  const p=
    game.prediction;

  const text =
`${home} vs ${away}
Home ${pct(p.homeWin)}%
Draw ${pct(p.draw)}%
Away ${pct(p.awayWin)}%
Over 1.5 ${pct(p.over15)}%
Over 2.5 ${pct(p.over25)}%
BTTS ${pct(p.btts)}%
Model: ${p.pick.text}`;

  navigator.clipboard
    ?.writeText(text)
    .then(
      ()=>alert("Prediction copied")
    )
    .catch(
      ()=>alert(text)
    );

}


/* =========================================================
   FORMATTING
   ========================================================= */

function formatDate(date){

  if(!(date instanceof Date))
    date =
      new Date(date);

  if(Number.isNaN(
    date.getTime()
  ))
    return "Time unknown";

  return date.toLocaleString(
    [],
    {
      day:"2-digit",
      month:"short",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}

function escapeHTML(str){

  return String(str||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function escapeAttr(str){

  return String(str||"")
    .replace(/'/g,"&#39;")
    .replace(/"/g,"&quot;");

}


/* =========================================================
   CLOCK
   ========================================================= */

setInterval(()=>{

  const status =
    document.getElementById(
      "status"
    );

  if(
    !status.innerText.includes(
      "Loading"
    )
  ){

    status.title =
      "Last browser time: "+
      new Date()
      .toLocaleTimeString();

  }

},1000);


/* =========================================================
   START
   ========================================================= */

loadAll();


/*
 * Refresh current fixtures
 * every 5 minutes.
 *
 * The database itself is persistent,
 * so previously processed matches
 * are not counted twice.
 */

setInterval(
  loadAll,
  5*60*1000
);

</script>
