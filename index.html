<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BANGO V40.6 LEGACY EMPIRE</title>
<style>
body{margin:0;color:#eee;font-family:Arial,sans-serif;padding:10px;background:linear-gradient(rgba(0,0,0,0.88),rgba(0,0,0,0.94)), url('legacy-empire.jpg');background-attachment:fixed;background-size:cover;background-position:center top;min-height:100vh}
h1{height:190px;background:url('legacy-empire.jpg') center/cover;border-radius:15px;border:2px solid #ffcc00;margin:8px 0;box-shadow:0 0 20px rgba(255,204,0,0.3)}
.sub{text-align:center;color:#ffcc88;font-size:11px;margin-bottom:10px;font-weight:bold}
.toolbar{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}button{background:rgba(17,17,17,0.9);color:#ffcc00;border:1px solid #ffcc00;border-radius:7px;padding:8px 11px;font-weight:bold;cursor:pointer;font-size:10px}button.active,button:hover{background:#ffcc00;color:#000}
.status{background:rgba(16,16,16,0.92);border:1px solid #333;border-radius:8px;padding:10px;margin-bottom:10px;text-align:center;color:#ffcc88;font-size:11px}
.statsbar{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:10px}.stat{background:rgba(16,16,16,0.92);border:1px solid #332a00;border-radius:8px;padding:6px;text-align:center}.stat b{display:block;color:#ffcc00;font-size:16px}
.controls{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}select,input{background:rgba(16,16,16,0.92);color:#fff;border:1px solid #444;border-radius:6px;padding:6px;flex:1;min-width:90px;font-size:10px}
#matches{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:8px}.card{background:rgba(12,12,12,0.94);border:1px solid #333;border-radius:11px;padding:9px;backdrop-filter:blur(6px)}.card.strong{border-color:#ffcc00;box-shadow:0 0 10px rgba(255,204,0,0.25)}.card.watch{border-color:#ffaa00}
.matchtop{display:flex;justify-content:space-between}.league{color:#aaa;font-size:8px}.time{color:#ffcc00;font-size:9px;font-weight:bold}.teams{text-align:center;font-weight:bold;margin:7px 0;font-size:14px}.vs{color:#555;padding:0 2px}
.badges{display:flex;gap:3px;flex-wrap:wrap;margin:3px 0}.badge{background:#1a1a0a;border:1px solid #444;border-radius:4px;padding:2px 4px;font-size:7px;color:#ccc}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;margin-top:5px}.market{background:rgba(18,18,18,0.9);border:1px solid #2a2a2a;border-radius:4px;padding:4px}.market span{display:block;color:#888;font-size:7px}.market strong{display:block;font-size:12px}
.good{color:#ffcc00}.warn{color:#ffaa00}.bad{color:#ff7777}
.analysis{margin-top:5px;border-top:1px solid #222;padding-top:5px}.row{display:flex;justify-content:space-between;font-size:8px}.reason{background:rgba(17,17,17,0.8);border-radius:4px;padding:4px;color:#ccc;font-size:8px;margin-top:3px}
.loading{padding:18px;text-align:center;color:#ffcc00}.progress{height:3px;background:#222;border-radius:10px;overflow:hidden;margin-top:3px}.progress i{display:block;height:100%;background:#ffcc00}
@media(max-width:700px){.statsbar{grid-template-columns:repeat(3,1fr)}#matches{grid-template-columns:1fr}h1{height:130px}}
</style>
</head>
<body>
<h1></h1>
<div class="sub">⚡ LESTER BANGO LEGACY • FAMILY • HOUSE • MUSTANG • PYTHON • 50 LEAGUES • 39 STRONG</div>
<div class="toolbar"><button id="todayBtn" class="active" onclick="loadDay(0)">TODAY</button><button id="tomorrowBtn" onclick="loadDay(1)">TOMORROW</button><button id="nextBtn" onclick="loadDay(2)">NEXT 2 DAYS</button><button id="allBtn" onclick="loadDay(7)">NEXT 14 DAYS</button><button onclick="refreshData()">REFRESH</button></div>
<div class="controls"><select id="qualityFilter" onchange="render()"><option value="ALL">All quality</option><option value="STRONG">Strong only</option><option value="WATCH">Watch only</option></select><select id="leagueFilter" onchange="render()"><option value="ALL">All leagues</option></select><input id="searchBox" placeholder="Search Chiefs, Pirates, Sundowns..." oninput="render()"><select id="sortBox" onchange="render()"><option value="QUALITY">Quality</option><option value="TIME">Time</option><option value="GOALS">Goals</option></select></div>
<div id="status" class="status">Starting V40.6 LEGACY EMPIRE...</div>
<div class="statsbar"><div class="stat"><b id="fixtureCount">0</b>Fixtures</div><div class="stat"><b id="sourceCount">0</b>Found</div><div class="stat"><b id="analysedCount">0</b>Analysed</div><div class="stat"><b id="strongCount">0</b>Strong</div><div class="stat"><b id="watchCount">0</b>Watch</div><div class="stat"><b id="leagueCount">0</b>Active</div></div>
<div id="matches"><div class="loading">Loading LEGACY EMPIRE 50 leagues...</div></div>
<script>
let state={fixtures:[],analyses:{},loading:false};
function todayISO(o=0){const d=new Date();d.setDate(d.getDate()+o);return d.toISOString().slice(0,10);}
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function norm(n){return String(n||"").toLowerCase().replace(/[^a-z0-9]/g,"");}
async function directFetch(url){try{const r=await fetch(url,{cache:"no-store"});if(!r.ok) throw new Error("bad");return await r.json();}catch(e){try{const r2=await fetch(`https://corsproxy.io/?${encodeURIComponent(url)}`);return await r2.json();}catch(e2){throw e;}}}
async function fetchSportsDBDay(date){try{const data=await directFetch(`https://www.thesportsdb.com/api/v1/json/3/eventsday.php?d=${date}&s=Soccer`);const ev=data.events;if(!Array.isArray(ev)) return [];return ev.map(e=>({source:"TheSportsDB",id:"sdb_"+e.idEvent,home:{name:e.strHomeTeam},away:{name:e.strAwayTeam},league:e.strLeague||"Unknown",date:e.strTimestamp?new Date(e.strTimestamp).toISOString():(e.dateEvent+"T"+(e.strTime||"15:00:00")+"Z"),live:false})).filter(x=>x.home.name&&x.away.name);}catch(e){return [];}}
async function fetchAllLeaguesDynamic(){try{const data=await directFetch(`https://www.thesportsdb.com/api/v1/json/3/all_leagues.php`);let leagues=data.leagues||[];leagues=leagues.filter(l=>l.strSport==="Soccer");const priority=["4328","4335","4332","4331","4334","4329","4330","4336","4337","4338","4339","4340","4344","4346","4351","4355","4362","4368","4370","4371","4372","4443","4480","4486","4521","4537","4687","4823","4831","4848"];let ids=[...priority];for(const l of leagues){if(ids.length>=60) break; if(!ids.includes(l.idLeague)) ids.push(l.idLeague);}document.getElementById("status").textContent=`Discovered ${leagues.length} leagues checking 60...`;let all=[];for(const id of ids){try{const d=await directFetch(`https://www.thesportsdb.com/api/v1/json/3/eventsnextleague.php?id=${id}`);const ev=d.events;if(!Array.isArray(ev)){await new Promise(r=>setTimeout(r,120));continue;}ev.forEach(e=>{all.push({source:"TheSportsDB",id:"sdb_"+e.idEvent,home:{name:e.strHomeTeam},away:{name:e.strAwayTeam},league:e.strLeague||"League "+id,date:e.strTimestamp?new Date(e.strTimestamp).toISOString():(e.dateEvent+"T15:00:00Z"),live:false});});document.getElementById("status").textContent=`Checking ${id}... ${all.length} fixtures`;await new Promise(r=>setTimeout(r,130));}catch(e){await new Promise(r=>setTimeout(r,130));continue;}}return all;}catch(e){return [];}}
async function fetchOpenLigaAll(){try{const avail=await directFetch(`https://api.openligadb.de/getavailableleagues`);let leagues=[];if(Array.isArray(avail)){leagues=avail.filter(l=>l.leagueShortcut).map(l=>l.leagueShortcut).slice(0,20);}else{leagues=["bl1","bl2","bl3","uefa","uel"];}let all=[];for(const lg of leagues){try{const data=await directFetch(`https://api.openligadb.de/getmatchdata/${lg}`);if(!Array.isArray(data)) continue;const now=new Date();const in21=new Date();in21.setDate(now.getDate()+21);data.filter(m=>{const d=new Date(m.matchDateTimeUTC);return d>=now&&d<=in21;}).forEach(m=>{all.push({source:"OpenLigaDB",id:"ol_"+m.matchID,home:{name:m.team1?.teamName},away:{name:m.team2?.teamName},league:m.leagueName||lg,date:m.matchDateTimeUTC,live:false});});}catch(e){continue;}}return all;}catch(e){return [];}}
function mergeAll(lists){const map=new Map();lists.flat().forEach(f=>{if(!f.home?.name||!f.away?.name) return;const key=norm(f.home.name)+"_vs_"+norm(f.away.name)+"_"+new Date(f.date).toISOString().slice(0,10);const ex=map.get(key);if(ex){ex.sources=[...new Set([...(ex.sources||[ex.source]),f.source])];}else{f.sources=[f.source];map.set(key,f);}});return [...map.values()].sort((a,b)=>new Date(a.date)-new Date(b.date));}
function poisson(k,l){if(l<=0) return 0;let p=Math.exp(-l);for(let i=1;i<=k;i++) p*=l/i;return p;}
function poissonOver(line,lam){let u=0;for(let k=0;k<=Math.floor(line);k++) u+=poisson(k,lam);return Math.max(0,Math.min(1,1-u));}
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function pct(v){return Math.round(clamp(v,1,99));}
function predict(f){const seed=(f.home.name+f.away.name+f.league).split('').reduce((a,c)=>a+c.charCodeAt(0),0);const r1=(seed%37)/100,r2=((seed*2)%29)/100,r3=((seed*3)%31)/100;let hl=1.2+r1*0.9+(f.league.toLowerCase().includes('bundesliga')?0.2:0)+(f.league.toLowerCase().includes('premier')?0.15:0);let al=0.85+r2*0.7+r3*0.2;let tot=hl+al;let hw=0,d=0,aw=0;for(let i=0;i<=6;i++) for(let j=0;j<=6;j++){const p=poisson(i,hl)*poisson(j,al);if(i>j) hw+=p; else if(i===j) d+=p; else aw+=p;}const s=hw+d+aw;hw=hw/s*100;d=d/s*100;aw=aw/s*100;return {homeWin:pct(hw),draw:pct(d),awayWin:pct(aw),over15:pct(poissonOver(1,tot)*100),over25:pct(poissonOver(2,tot)*100),btts:pct((1-Math.exp(-hl))*(1-Math.exp(-al))*100),total:tot,homeLambda:hl,awayLambda:al,confidence:pct(60+Math.abs(hw-aw)*0.25+tot*3),expected:tot.toFixed(2)};}
function cardHTML(f){const a=state.analyses[f.id];const q=a?.quality||"NO BET";const m=a?.model;const cls=q==="STRONG"?"strong":q==="WATCH"?"watch":"nobet";const qcol=q==="STRONG"?"qgood":q==="WATCH"?"qmid":"qbad";const time=new Date(f.date).toLocaleString("en-ZA",{month:"short",day:"2-digit",hour:"2-digit",minute:"2-digit"});return `<div class="card ${cls}"><div class="matchtop"><div><div class="league">${esc(f.league)} • ${esc(f.source)}</div></div><div class="time">${time}</div></div><div class="teams">${esc(f.home.name)}<span class="vs">vs</span>${esc(f.away.name)}</div><div class="badges"><span class="badge quality ${qcol}">${q}</span><span class="badge">${esc(a.prediction)} ${a.bestPct}%</span><span class="badge">xG ${m.homeLambda.toFixed(2)}-${m.awayLambda.toFixed(2)}</span></div><div class="grid"><div class="market"><span>HOME</span><strong class="${m.homeWin>=60?"good":m.homeWin>=45?"warn":"bad"}">${m.homeWin}%</strong></div><div class="market"><span>DRAW</span><strong class="bad">${m.draw}%</strong></div><div class="market"><span>AWAY</span><strong class="${m.awayWin>=60?"good":m.awayWin>=45?"warn":"bad"}">${m.awayWin}%</strong></div><div class="market"><span>OVER 1.5</span><strong class="${m.over15>=68?"good":"warn"}">${m.over15}%</strong></div><div class="market"><span>OVER 2.5</span><strong class="${m.over25>=55?"good":"warn"}">${m.over25}%</strong></div><div class="market"><span>BTTS</span><strong class="${m.btts>=55?"good":"warn"}">${m.btts}%</strong></div></div><div class="analysis"><div class="row"><span>Total xG</span><b>${m.expected}</b></div><div class="progress"><i style="width:${m.confidence}%"></i></div><div class="reason"><b>READING:</b> ${esc(f.home.name)} vs ${esc(f.away.name)} → <b>${esc(a.prediction)}</b> (${a.bestPct}%)</div></div></div>`;}
function render(){const q=document.getElementById("searchBox").value.toLowerCase().trim();const fq=document.getElementById("qualityFilter").value;const lf=document.getElementById("leagueFilter").value;const sort=document.getElementById("sortBox").value;let list=state.fixtures.filter(f=>{const a=state.analyses[f.id];const qual=a?.quality||"NO BET";if(fq!=="ALL"&&qual!==fq) return false;if(lf!=="ALL"&&f.league!==lf) return false;if(q&&!`${f.home.name} ${f.away.name} ${f.league}`.toLowerCase().includes(q)) return false;return true;});if(sort==="TIME") list.sort((a,b)=>new Date(a.date)-new Date(b.date));else if(sort==="GOALS") list.sort((a,b)=>(state.analyses[b.id]?.model?.total||0)-(state.analyses[a.id]?.model?.total||0));else{const rank={"STRONG":3,"WATCH":2,"NO BET":1};list.sort((a,b)=>(rank[state.analyses[b.id]?.quality||"NO BET"]||0)-(rank[state.analyses[a.id]?.quality||"NO BET"]||0));}document.getElementById("matches").innerHTML=list.length?list.map(cardHTML).join(""):`<div class="error">No fixtures</div>`;document.getElementById("fixtureCount").textContent=state.fixtures.length;document.getElementById("analysedCount").textContent=Object.keys(state.analyses).length;document.getElementById("strongCount").textContent=Object.values(state.analyses).filter(x=>x.quality==="STRONG").length;document.getElementById("watchCount").textContent=Object.values(state.analyses).filter(x=>x.quality==="WATCH").length;const leagues=[...new Set(state.fixtures.map(f=>f.league))].sort();document.getElementById("leagueCount").textContent=leagues.length;const sel=document.getElementById("leagueFilter");const cur=sel.value;sel.innerHTML=`<option value="ALL">All leagues (${leagues.length})</option>`+leagues.map(l=>`<option value="${esc(l)}">${esc(l)}</option>`).join("");sel.value=cur;}
async function loadDay(offset){if(state.loading) return;state.loading=true;state.fixtures=[];state.analyses={};document.querySelectorAll(".toolbar button").forEach(b=>b.classList.remove("active"));if(offset===0) document.getElementById("todayBtn").classList.add("active");else if(offset===1) document.getElementById("tomorrowBtn").classList.add("active");else if(offset===2) document.getElementById("nextBtn").classList.add("active");else document.getElementById("allBtn").classList.add("active");document.getElementById("matches").innerHTML=`<div class="loading">LEGACY EMPIRE: discovering 50 leagues...</div>`;document.getElementById("status").textContent=`Fetching LEGACY EMPIRE...`;let all=[];let ok=0;if(offset<=2){const day=await fetchSportsDBDay(todayISO(offset));all.push(...day);if(day.length) ok++;}const dyn=await fetchAllLeaguesDynamic();all.push(...dyn);if(dyn.length) ok++;const ol=await fetchOpenLigaAll();all.push(...ol);if(ol.length) ok++;const merged=mergeAll([all]).slice(0,150);state.fixtures=merged;for(const f of merged){const m=predict(f);const opts=[["HOME WIN",m.homeWin],["AWAY WIN",m.awayWin],["OVER 1.5",m.over15],["OVER 2.5",m.over25],["BTTS",m.btts]];opts.sort((a,b)=>b[1]-a[1]);let best=opts[0][0],bp=opts[0][1];let q="NO BET";if(bp>=68) q="STRONG";else if(bp>=55) q="WATCH";state.analyses[f.id]={model:m,quality:q,prediction:best,bestPct:bp,available:true};}document.getElementById("sourceCount").textContent=`${merged.length}`;document.getElementById("status").textContent=`LEGACY EMPIRE DONE: ${merged.length} fixtures from ${[...new Set(merged.map(f=>f.league))].length} leagues — ${Object.values(state.analyses).filter(x=>x.quality==="STRONG").length} STRONG`;render();state.loading=false;}
async function refreshData(){localStorage.clear();await loadDay(0);}
loadDay(0);
</script>
</body>
  </html>
