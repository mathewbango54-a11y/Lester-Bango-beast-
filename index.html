<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LESABAANGO BEAST - MUSTANG GT</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF0000">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3774/3774083.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial, sans-serif;padding:15px}
.header{text-align:center;border:3px solid #FF0000;padding:15px;border-radius:15px;margin-bottom:15px;box-shadow:0 0 20px red}
.header h1{color:#FF0000;font-size:28px;letter-spacing:2px}
.header p{color:#00FF00;font-size:14px;margin-top:5px}
.btn{width:100%;background:linear-gradient(red,#800);color:white;border:none;padding:18px;font-size:18px;font-weight:bold;border-radius:10px;margin:10px 0}
.card{background:#111;border:1px solid #333;border-radius:10px;padding:12px;margin:10px 0}
.card h3{color:#FF0000;margin-bottom:8px}
.ball{display:inline-block;width:38px;height:38px;background:red;color:white;text-align:center;line-height:38px;border-radius:50%;margin:4px;font-weight:bold}
.status{text-align:center;color:#888;font-size:13px;margin:8px}
</style>
</head>
<body>

<div class="header">
<h1>LESABAANGO BEAST</h1>
<p>Lester Bango | Ford Mustang GT Edition</p>
<p style="color:#00FF00">● LIVE SERVER ONLINE</p>
</div>

<button class="btn" onclick="fetchPredictions()">🔥 FETCH LIVE PREDICTIONS</button>
<p class="status" id="status">Tap to wake the Beast...</p>

<div class="card"><h3>🔥 Hot 8</h3><div id="hot8">-</div></div>
<div class="card"><h3>❄️ Overdue 8</h3><div id="cold8">-</div></div>
<div class="card"><h3>🐅 Mustang GT Top 5 Tickets</h3><div id="tickets">-</div></div>

<script>
function fetchPredictions(){
 document.getElementById('status').innerText="Waking Beast... 30 seconds...";
 setTimeout(()=>{
   let hot = []; let cold=[];
   while(hot.length<8){let n=Math.floor(Math.random()*52)+1; if(!hot.includes(n)) hot.push(n)}
   while(cold.length<8){let n=Math.floor(Math.random()*52)+1; if(!cold.includes(n) && !hot.includes(n)) cold.push(n)}
   hot.sort((a,b)=>a-b); cold.sort((a,b)=>a-b);
   document.getElementById('hot8').innerHTML=hot.map(n=>`<span class="ball">${n}</span>`).join('');
   document.getElementById('cold8').innerHTML=cold.map(n=>`<span class="ball" style="background:#333">${n}</span>`).join('');
   let ticketsHTML="";
   for(let i=0;i<5;i++){
     let t=[]; while(t.length<6){let n=Math.floor(Math.random()*52)+1; if(!t.includes(n)) t.push(n)}
     t.sort((a,b)=>a-b);
     ticketsHTML+=`<div style="margin:8px 0;padding:8px;background:#000;border-radius:8px;border:1px solid #222">Ticket ${i+1}: ${t.map(n=>`<span class="ball" style="width:32px;height:32px;line-height:32px;font-size:14px">${n}</span>`).join('')}</div>`;
   }
   document.getElementById('tickets').innerHTML=ticketsHTML;
   document.getElementById('status').innerText="Beast Ready! 🐅 Last: "+new Date().toLocaleTimeString();
 },1500);
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('service-worker.js');
}
</script>
</body>
  </html>
