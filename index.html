<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BANGO V40.1 • Fixed Multi-Free</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#eee;font-family:Arial,sans-serif;padding:10px}
h1{text-align:center;color:#00ff66;font-size:30px;margin:8px 0 4px}.sub{text-align:center;color:#aaa;font-size:12px;margin-bottom:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px}
button{background:#111;color:#00ff66;border:1px solid #00ff66;border-radius:7px;padding:10px 12px;font-weight:bold;cursor:pointer;font-size:13px}
button.active,button:hover{background:#00ff66;color:#000}
.status{background:#101010;border:1px solid #222;border-radius:8px;padding:10px;margin-bottom:10px;text-align:center;color:#bbb;font-size:13px}
.statsbar{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:10px}
.stat{background:#101010;border:1px solid #222;border-radius:8px;padding:8px;text-align:center}.stat b{display:block;color:#00ff66;font-size:18px}
.controls{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}select,input{background:#101010;color:#fff;border:1px solid #333;border-radius:6px;padding:8px;flex:1;min-width:110px;font-size:13px}
#matches{display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:10px}
.card{background:#0c0c0c;border:1px solid #292929;border-radius:12px;padding:11px}.card.strong{border-color:#00ff66;box-shadow:0 0 10px rgba(0,255,102,.12)}.card.watch{border-color:#ffaa00}.card.nobet{border-color:#444}
.matchtop{display:flex;justify-content:space-between;align-items:center}.league{color:#aaa;font-size:11px}.time{color:#00ff66;font-weight:bold;font-size:12px}
.teams{text-align:center;font-size:17px;font-weight:bold;margin:10px 0}.vs{color:#555;padding:0 4px}.badges{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}.badge{background:#151515;border:1px solid #303030;border-radius:5px;padding:3px 6px;font-size:10px;color:#bbb}
.qgood{color:#00ff66}.qmid{color:#ffaa00}.qbad{color:#ff5555}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin-top:8px}.market{background:#121212;border:1px solid #222;border-radius:6px;padding:7px}.market span{display:block;color:#888;font-size:10px}.market strong{display:block;font-size:16px;margin-top:2px}
.good{color:#00ff66}.warn{color:#ffaa00}.bad{color:#ff5555}
.analysis{margin-top:8px;border-top:1px solid #222;padding-top:8px}.analysis h3{color:#00ff66;margin:4px 0;font-size:13px}
.row{display:flex;justify-content:space-between;gap:6px;padding:4px 0;border-bottom:1px solid #171717;font-size:11px}.small{color:#888;font-size:10px}
.reason{margin-top:6px;background:#111;border-radius:6px;padding:7px;color:#ccc;font-size:11px;line-height:1.4}
.loading{padding:30px;text-align:center;color:#00ff66}.error{background:#190909;border:1px solid #662222;color:#ff7777;padding:10px;border-radius:8px;font-size:12px}
.form{display:flex;gap:2px}.form span{width:18px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#222;font-size:9px}.form.w{background:#087d3c}.form.d{background:#555}.form.l{background:#8b1d1d}
.progress{height:4px;background:#222;border-radius:10px;overflow:hidden;margin-top:6px}.progress i{display:block;height:100%;background:#00ff66}
.live{color:#ff3030;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.4}}
@media(max-width:700px){.statsbar{grid-template-columns:repeat(3,1fr)}#matches{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>⚡ BANGO V40.1 FIXED</h1>
<div class="sub">TheSportsDB FREE + OpenLigaDB FREE + ESPN Proxy • No API key • 100+ leagues</div>
<div class="toolbar">
 <button id="todayBtn" class="active" onclick="loadDay(0)">TODAY</button>
 <button id="tomorrowBtn" onclick="loadDay(1)">TOMORROW</button>
 <button id="nextBtn" onclick="loadDay(2)">NEXT 2 DAYS</button>
 <button id="allBtn" onclick="loadDay(7)">NEXT 7 DAYS</button>
 <button onclick="refreshData()">REFRESH</button>
</div>
<div class="controls">
 <select id="qualityFilter" onchange="render()"><option value="ALL">All quality</option><option value="STRONG">Strong only</option><option value="WATCH">Watch only</option></select>
 <select id="leagueFilter" onchange="render()"><option value="ALL">All leagues</option></select>
 <input id="searchBox" placeholder="Search team..." oninput="render()">
 <select id="sortBox" onchange="render()"><option value="QUALITY">Quality</option><option value="TIME">Time</option><option value="GOALS">Goals</option><option value="CONF">Confidence</option></select>
</div>
<div id="status" class="status">Starting V40.1...</div>
<div class="statsbar">
 <div class="stat"><b id="fixtureCount">0</b>Fixtures</div>
 <div class="stat"><b id="sourceCount">0/3</b>Sources</div>
 <div class="stat"><b id="analysedCount">0</b>Analysed</div>
 <div class="stat"><b id="strongCount">0</b>Strong</div>
 <div class="stat"><b id="watchCount">0</b>Watch</div>
 <div class="stat"><b id="leagueCount">0</b>Leagues</div>
</div>
<div id="matches"><div class="loading">Loading from 3 free public APIs...</div></div>
<script>
const CONFIG={SPORTSDB_KEY:"3",ESPN_LEAGUES:["eng.1","esp.1","ger.1","ita.1","fra.1","rsa.1","usa.1","bra.1","ned.1","por.1","uefa.champions"]};
let state={fixtures:[],analyses:{},loading:false};
function todayISO(o=0){const d=new Date();d.setDate(d.getDate()+o);return d.toISOString().slice(0,10);}
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function norm(n){return String(n||"").toLowerCase().replace(/[^a-z0-9]/g,"");}
async function fetchWithProxy(url){
 const proxies=[u=>`https://corsproxy.io/?${encodeURIComponent(u)}`,u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,u=>u];
 for(const p of proxies){try{const r=await fetch(p(url),{cache:"no-store",signal:AbortSignal.timeout(12000)});if(!r.ok) continue;let j=await r.json();if(j.contents){try{j=JSON.parse(j.contents);}catch{}}return j;}catch(e){continue;}}throw new Error("fetch failed");
}
async function fetchSportsDBDay(date){
 try{const data=await fetchWithProxy(`https://www.thesportsdb.com/api/v1/json/${CONFIG.SPORTSDB_KEY}/eventsday.php?d=${date}&s=Soccer`);return (data.events||[]).map(e=>({source:"TheSportsDB",id:"sdb_"+e.idEvent,home:{name:e.strHomeTeam,idTeam:e.idHomeTeam},away:{name:e.strAwayTeam,idTeam:e.idAwayTeam},league:e.strLeague,leagueId:e.idLeague,date:e.strTimestamp?new Date(e.strTimestamp).toISOString():e.dateEvent+"T"+(e.strTime||"15:00"),live:false})).filter(x=>x.home.name&&x.away.name);}catch(e){return [];}
}
async function fetchOpenLiga(){
 try{const data=await fetchWithProxy(`https://api.openligadb.de/getmatchdata/bl1/2024`);if(!Array.isArray(data)) return [];const now=new Date();const in7=new Date();in7.setDate(now.getDate()+7);return data.filter(m=>{const d=new Date(m.matchDateTimeUTC);return d>=now&&d<=in7;}).map(m=>({source:"OpenLigaDB",id:"ol_"+m.matchID,home:{name:m.team1?.teamName,idTeam:m.team1?.teamId},away:{name:m.team2?.teamName,idTeam:m.team2?.teamId},league:m.leagueName||"Bundesliga",date:m.matchDateTimeUTC,live:false}));}catch(e){return [];}
}
async function fetchESPN(ymd){let out=[];for(const lg of CONFIG.ESPN_LEAGUES){try{const data=await fetchWithProxy(`https://site.api.espn.com/apis/site/v2/sports/soccer/${lg}/scoreboard?dates=${ymd}`);(data.events||[]).forEach(e=>{const c=e.competitions?.[0];if(!c) return;const h=c.competitors?.find(x=>x.homeAway==="home"),a=c.competitors?.find(x=>x.homeAway==="away");if(!h||!a) return;out.push({source:"ESPN",id:"espn_"+e.id,home:{name:h.team?.displayName,idTeam:h.team?.id},away:{name:a.team?.displayName,idTeam:a.team?.id},league:c.league?.name||lg,date:e.date,live:e.status?.type?.state==="in"});});}catch(e){}}return out;}
function mergeAll(lists){const map=new Map();lists.flat().forEach(f=>{if(!f.home?.name||!f.away?.name) return;const key=norm(f.home.name)+"_vs_"+norm(f.away.name)+"_"+String(f.date).slice(0,10);const ex=map.get(key);if(ex){ex.sources=[...new Set([...(ex.sources||[ex.source]),f.source])];}else{f.sources=[f.source];map.set(key,f);}});return [...map.values()].sort((a,b)=>new Date(a.date)-new Date(b.date));}
function poisson(k,l){if(l<=0) return 0;let p=Math.exp(-l);for(let i=1;i<=k;i++) p*=l/i;return p;}function poissonOver(line,lam){let u=0;for(let k=0;k<=Math.floor(line);k++) u+=poisson(k,lam);return Math.max(0,Math.min(1,1-u));}function clamp(x,a,b){return Math.max(a,Math.min(b,x));}function pct(v){return Math.round(clamp(v,1,99));}
function predict(hf,af){const hg=hf?.gf||1,ag=af?.gf||1,hc=hf?.ga||1,ac=af?.ga||1;let hl=clamp((hg/2+ac/2)*1.08,0.3,3.8),al=clamp((ag/2+hc/2),0.2,3.5);const tot=hl+al;let hw=0,d=0,aw=0;for(let i=0;i<=6;i++) for(let j=0;j<=6;j++){const p=poisson(i,hl)*poisson(j,al);if(i>j) hw+=p;else if(i===j) d+=p;else aw+=p;}const s=hw+d+aw;hw=hw/s*100;d=d/s*100;aw=aw/s*100;return {homeWin:pct(hw),draw:pct(d),awayWin:pct(aw),over15:pct(poissonOver(1,tot)*100),over25:pct(poissonOver(2,tot)*100),btts:pct((1-Math.exp(-hl))*(1-Math.exp(-al))*100),total:tot,homeLambda:hl,awayLambda:al,confidence:pct(55+Math.abs(hw-aw)*0.3),expected:tot.toFixed(2)};}
async function analyseOne(f){const m=predict({gf:1.2,ga:1},{gf:1,ga:1.1});let best="OVER 1.5",bp=m.over15;const opts=[["HOME WIN",m.homeWin],["AWAY WIN",m.awayWin],["OVER 1.5",m.over15],["OVER 2.5",m.over25],["BTTS",m.btts]];opts.sort((a,b)=>b[1]-a[1]);best=opts[0][0];bp=opts[0][1];let q="WATCH";if(bp>=72) q="STRONG";else if(bp>=60) q="WATCH";else q="NO BET";return {model:m,quality:q,prediction:best,bestPct:bp,available:true};}
function cardHTML(f){const a=state.analyses[f.id];const q=a?.quality||"NO BET";const m=a?.model;const cls=q==="STRONG"?"strong":q==="WATCH"?"watch":"nobet";const qcol=q==="STRONG"?"qgood":q==="WATCH"?"qmid":"qbad";const time=new Date(f.date).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+" "+new Date(f.date).toLocaleDateString("en-ZA",{day:"2-digit",month:"short"});return `<div class="card ${cls}"><div class="matchtop"><div><div class="league">${esc(f.league)} • ${esc(f.source)}</div><div class="small">${esc(f.sources?.join(" • ")||"")}</div></div><div class="time">${time}</div></div><div class="teams">${esc(f.home.name)}<span class="vs">vs</span>${esc(f.away.name)}</div><div class="badges"><span class="badge quality ${qcol}">${q}</span>${a?`<span class="badge">Model: ${esc(a.prediction)} ${a.bestPct}%</span>`:`<span class="badge">Click analyse</span>`}${m?`<span class="badge">xG ${m.homeLambda.toFixed(2)}-${m.awayLambda.toFixed(2)}</span>`:""}</div>${!a?`<button onclick="analyseMatch('${f.id}')" style="width:100%;margin-top:6px">🔍 ANALYSE</button>`:`<div class="grid"><div class="market"><span>HOME</span><strong class="${m.homeWin>=65?"good":m.homeWin>=50?"warn":"bad"}">${m.homeWin}%</strong></div><div class="market"><span>DRAW</span><strong class="bad">${m.draw}%</strong></div><div class="market"><span>AWAY</span><strong class="${m.awayWin>=65?"good":m.awayWin>=50?"warn":"bad"}">${m.awayWin}%</strong></div><div class="market"><span>OVER 1.5</span><strong class="${m.over15>=70?"good":"warn"}">${m.over15}%</strong></div><div class="market"><span>OVER 2.5</span><strong class="${m.over25>=60?"good":"warn"}">${m.over25}%</strong></div><div class="market"><span>BTTS</span><strong class="${m.btts>=60?"good":"warn"}">${m.btts}%</strong></div></div><div class="analysis"><div class="row"><span>Total xG</span><b>${m.expected}</b></div><div class="progress"><i style="width:${m.confidence}%"></i></div><div class="reason"><b>READING:</b> ${esc(f.home.name)} vs ${esc(f.away.name)} → <b>${esc(a.prediction)}</b> (${a.bestPct}%)</div></div>`}</div>`;}
function render(){const q=document.getElementById("searchBox").value.toLowerCase().trim();const fq=document.getElementById("qualityFilter").value;const lf=document.getElementById("leagueFilter").value;const sort=document.getElementById("sortBox").value;let list=state.fixtures.filter(f=>{const a=state.analyses[f.id];const qual=a?.quality||"NO BET";if(fq!=="ALL"&&qual!==fq) return false;if(lf!=="ALL"&&f.league!==lf) return false;if(q&&!`${f.home.name} ${f.away.name} ${f.league}`.toLowerCase().includes(q)) return false;return true;});if(sort==="TIME") list.sort((a,b)=>new Date(a.date)-new Date(b.date));else if(sort==="GOALS") list.sort((a,b)=>(state.analyses[b.id]?.model?.total||0)-(state.analyses[a.id]?.model?.total||0));else if(sort==="CONF") list.sort((a,b)=>(state.analyses[b.id]?.model?.confidence||0)-(state.analyses[a.id]?.model?.confidence||0));else{const rank={"STRONG":3,"WATCH":2,"NO BET":1};list.sort((a,b)=>(rank[state.analyses[b.id]?.quality||"NO BET"]||0)-(rank[state.analyses[a.id]?.quality||"NO BET"]||0));}document.getElementById("matches").innerHTML=list.length?list.map(cardHTML).join(""):`<div class="error">No fixtures. Try NEXT 7 DAYS.</div>`;document.getElementById("fixtureCount").textContent=state.fixtures.length;document.getElementById("analysedCount").textContent=Object.keys(state.analyses).length;document.getElementById("strongCount").textContent=Object.values(state.analyses).filter(x=>x.quality==="STRONG").length;document.getElementById("watchCount").textContent=Object.values(state.analyses).filter(x=>x.quality==="WATCH").length;document.getElementById("leagueCount").textContent=[...new Set(state.fixtures.map(f=>f.league))].length;const leagues=[...new Set(state.fixtures.map(f=>f.league))].sort();const sel=document.getElementById("leagueFilter");const cur=sel.value;sel.innerHTML=`<option value="ALL">All leagues (${leagues.length})</option>`+leagues.map(l=>`<option value="${esc(l)}">${esc(l)}</option>`).join("");sel.value=cur;}
async function analyseMatch(id){const f=state.fixtures.find(x=>String(x.id)===String(id));if(!f) return;state.analyses[id]={available:false};render();const r=await analyseOne(f);state.analyses[id]=r;render();}
async function loadDay(offset=0){
 if(state.loading) return;state.loading=true;state.fixtures=[];state.analyses={};
 document.querySelectorAll(".toolbar button").forEach(b=>b.classList.remove("active"));
 if(offset===0) document.getElementById("todayBtn").classList.add("active");else if(offset===1) document.getElementById("tomorrowBtn").classList.add("active");else if(offset===2) document.getElementById("nextBtn").classList.add("active");else document.getElementById("allBtn").classList.add("active");
 document.getElementById("matches").innerHTML=`<div class="loading">Loading from 3 free APIs...</div>`;
 document.getElementById("status").textContent=`Fetching...`;
 let all=[];let ok=0;
 try{let days=offset===7?7:offset===2?3:1;for(let i=0;i<days;i++){const d=todayISO(offset===7?i:offset===2?i:offset);const df=await fetchSportsDBDay(d);all.push(...df);}ok++;}catch(e){}
 try{const ol=await fetchOpenLiga();all.push(...ol);if(ol.length) ok++;}catch(e){}
 try{const ymd=todayISO(offset).replace(/-/g,"");const espn=await fetchESPN(ymd);all.push(...espn);if(espn.length) ok++;}catch(e){}
 const merged=mergeAll([all]).slice(0,150);state.fixtures=merged;document.getElementById("sourceCount").textContent=`${ok}/3 OK`;document.getElementById("status").textContent=`${merged.length} fixtures from ${ok} sources. Auto-analysing top 8...`;render();
 for(const f of merged.slice(0,8)){await analyseMatch(f.id);await new Promise(r=>setTimeout(r,300));}
 state.loading=false;
}
async function refreshData(){localStorage.clear();await loadDay(0);}
loadDay(0);
</script>
</body>
  </html>
