<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesabaango Beast</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#05070a;color:#fff;font-family:system-ui;padding:12px}
.header{background:linear-gradient(135deg,#ff0000,#600);padding:20px;border-radius:18px;text-align:center;border:2px solid #ff3333;box-shadow:0 0 30px rgba(255,0,0,.4)}
.live{background:#00ff00;color:#000;display:inline-block;padding:5px 14px;border-radius:20px;font-weight:900;font-size:12px;margin-top:8px}
.card{background:#11151c;border:1px solid #222;border-radius:16px;padding:16px;margin:14px 0}
.ball{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ff5555,#8b0000);display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;margin:5px;border:2px solid #ff7777;box-shadow:0 4px 12px rgba(255,0,0,.5)}
.hot{border-color:gold;background:radial-gradient(circle at 30% 30%,#ffbb00,#ff6600)}
.btn{width:100%;padding:18px;background:linear-gradient(135deg,#ff0000,#ff6600);border:none;border-radius:12px;color:#fff;font-weight:900;font-size:19px}
.combo{background:#0d1117;border:1px solid #333;border-radius:12px;padding:14px;margin:10px 0}
.score{float:right;background:#00ff00;color:#000;padding:3px 10px;border-radius:10px;font-weight:900;font-size:12px}
</style>
</head>
<body>
<div class="header">
<h1>🐅 LESABAANGO BEAST</h1>
<p>Lester Bango | Ford Mustang GT Edition</p>
<div class="live">● LIVE SERVER ONLINE</div>
<div style="font-size:11px;margin-top:6px;opacity:.7">lester-bango-beast.onrender.com</div>
</div>

<div class="card">
<button class="btn" onclick="fetchBeast()">🔥 FETCH LIVE PREDICTIONS</button>
<div id="status" style="text-align:center;margin-top:10px;opacity:.8">Tap to load your 5 tickets</div>
</div>

<div class="card" id="latest" style="display:none">
<h3>📊 Latest Draw</h3>
<div id="latestBalls"></div>
<div id="latestInfo" style="font-size:12px;opacity:.6;margin-top:8px"></div>
</div>

<div class="card">
<h3>🔥 Hot 8</h3>
<div id="hot"></div>
<h3 style="margin-top:12px">❄️ Overdue 8</h3>
<div id="cold"></div>
</div>

<div class="card">
<h3>🏎️ MUSTANG GT TOP 5 TICKETS</h3>
<div id="combos"></div>
</div>

<script>
const API="https://lester-bango-beast.onrender.com/api/predict";
async function fetchBeast(){
 document.getElementById('status').innerHTML='⏳ Waking Beast... (30 sec first time)';
 try{
  let r=await fetch(API); let d=await r.json();
  document.getElementById('status').innerHTML='✅ LIVE - '+d.totalDraws+' draws analyzed | Updated: '+new Date(d.lastUpdate).toLocaleTimeString();
  document.getElementById('latest').style.display='block';
  document.getElementById('latestBalls').innerHTML=d.latest.map(n=>`<div class=ball>${n}</div>`).join('');
  document.getElementById('latestInfo').innerHTML='Latest official numbers';
  document.getElementById('hot').innerHTML=d.hot.map(n=>`<div class="ball hot">${n}</div>`).join('');
  document.getElementById('cold').innerHTML=d.cold.map(n=>`<div class=ball style="background:radial-gradient(circle at 30% 30%,#5599ff,#003366)">${n}</div>`).join('');
  document.getElementById('combos').innerHTML=d.combos.slice(0,5).map((c,i)=>`
    <div class=combo>
      <span class=score>${c.score}% BEAST</span>
      <b style="color:#ff6600">TICKET ${i+1}</b><br>
      <div style="margin-top:8px">${c.numbers.map(n=>`<div class="ball ${d.hot.includes(n)?'hot':''}">${n}</div>`).join('')}</div>
      <div style="font-size:11px;opacity:.6;margin-top:6px">Sum: ${c.sum} | Play this for Mustang GT!</div>
    </div>`).join('');
 }catch(e){
  document.getElementById('status').innerHTML='❌ Server sleeping, wait 30 sec then tap again<br><small>'+e+'</small>';
 }
}
fetchBeast();
</script>
</body>
  </html>
