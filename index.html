<script>

/* =========================================================
   BANGO V34
   ========================================================= */

const VERSION="V34";

const LEAGUES=[

 {id:"eng.1",name:"Premier League",country:"England"},
 {id:"eng.2",name:"Championship",country:"England"},

 {id:"esp.1",name:"La Liga",country:"Spain"},

 {id:"ger.1",name:"Bundesliga",country:"Germany"},

 {id:"ita.1",name:"Serie A",country:"Italy"},

 {id:"fra.1",name:"Ligue 1",country:"France"},

 {id:"ned.1",name:"Eredivisie",country:"Netherlands"},

 {id:"rsa.1",name:"PSL",country:"South Africa"},

 {id:"uefa.champions",
  name:"Champions League",
  country:"Europe"
 },

 {id:"uefa.europa",
  name:"Europa League",
  country:"Europe"
 }

];

let allMatches=[];
let activeDay=0;


/* =========================================================
   DATE
   ========================================================= */

function localDate(offset=0){

 const d=new Date();

 d.setDate(d.getDate()+offset);

 return d;

}

function ymd(d){

 return d.getFullYear()+
 String(d.getMonth()+1).padStart(2,"0")+
 String(d.getDate()).padStart(2,"0");

}

function displayDate(date){

 return new Date(date).toLocaleString(
  "en-ZA",
  {
   day:"2-digit",
   month:"short",
   hour:"2-digit",
   minute:"2-digit"
  }
 );

}


/* =========================================================
   PROXY FETCH
   ========================================================= */

async function fetchWithProxy(url){

 const proxies=[

  u=>`https://corsproxy.io/?${encodeURIComponent(u)}`,

  u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,

  u=>u

 ];

 for(const make of proxies){

  try{

   const response=await fetch(
    make(url),
    {
     cache:"no-store",
     signal:AbortSignal.timeout(15000)
    }
   );

   if(!response.ok){
    throw new Error("HTTP "+response.status);
   }

   const data=await response.json();

   if(data.events||data.events===null){
    return data;
   }

   if(data.contents){

    try{
     return JSON.parse(data.contents);
    }catch(e){}

   }

   return data;

  }catch(error){

   continue;

  }

 }

 throw new Error("All data connections failed");

}


/* =========================================================
   ESPN FIXTURE SOURCE
   ========================================================= */

async function getLeague(league,date){

 const url=
 `https://site.api.espn.com/apis/site/v2/sports/soccer/${league}/scoreboard?dates=${date}`;

 try{

  const data=await fetchWithProxy(url);

  return data.events||[];

 }catch(error){

  return [];

 }

}


/* =========================================================
   NORMALISE EVENT
   ========================================================= */

function normaliseEvent(event,league){

 const comp=event.competitions?.[0];

 if(!comp) return null;

 const competitors=comp.competitors||[];

 const home=
 competitors.find(
  x=>x.homeAway==="home"
 );

 const away=
 competitors.find(
  x=>x.homeAway==="away"
 );

 if(!home||!away) return null;

 const state=
 event.status?.type?.state||"";

 return{

  id:event.id,

  league:league.name,

  country:league.country,

  date:event.date,

  home:{
   id:home.team?.id,
   name:home.team?.displayName||"Home",
   score:Number(home.score||0)
  },

  away:{
   id:away.team?.id,
   name:away.team?.displayName||"Away",
   score:Number(away.score||0)
  },

  state:state,

  completed:
   !!event.status?.type?.completed,

  live:
   state==="in" &&
   !event.status?.type?.completed,

  status:
   event.status?.type?.shortDetail||"",

  venue:
   comp.venue?.fullName||"",

  raw:event

 };

}


/* =========================================================
   FIXTURES
   ========================================================= */

async function loadFixtures(){

 setStatus(
  "🟡 Loading real football fixtures..."
 );

 const dates=[
  ymd(localDate(0)),
  ymd(localDate(1)),
  ymd(localDate(2))
 ];

 let output=[];

 for(const date of dates){

  const requests=
   LEAGUES.map(
    league=>
     getLeague(league.id,date)
     .then(events=>
      events
      .map(e=>normaliseEvent(e,league))
      .filter(Boolean)
     )
   );

  const results=
   await Promise.all(requests);

  results.forEach(
   list=>output.push(...list)
  );

 }

 const unique=new Map();

 output.forEach(
  match=>unique.set(match.id,match)
 );

 allMatches=
  [...unique.values()]
  .sort(
   (a,b)=>
    new Date(a.date)-
    new Date(b.date)
  );

 return allMatches;

}


/* =========================================================
   FORM CACHE
   ========================================================= */

const CACHE_KEY="bango_form_v34";

let formCache={};

try{

 formCache=
  JSON.parse(
   localStorage.getItem(CACHE_KEY)||"{}"
  );

}catch(e){

 formCache={};

}

function saveCache(){

 try{

  localStorage.setItem(
   CACHE_KEY,
   JSON.stringify(formCache)
  );

 }catch(e){}

}


/* =========================================================
   TEAM FORM
   ========================================================= */

async function getTeamForm(teamId){

 if(!teamId) return null;

 const cached=formCache[teamId];

 if(
  cached &&
  Date.now()-cached._ts<
  1000*60*60*6
 ){

  return cached;

 }

 for(const league of LEAGUES){

  try{

   const url=
    `https://site.api.espn.com/apis/site/v2/sports/soccer/${league.id}/teams/${teamId}/schedule`;

   const data=
    await fetchWithProxy(url);

   const events=
    data.events||[];

   if(!events.length) continue;

   const games=[];

   events

   .filter(
    e=>e.status?.type?.completed
   )

   .sort(
    (a,b)=>
     new Date(b.date)-
     new Date(a.date)
   )

   .slice(0,10)

   .forEach(event=>{

    const c=
     event.competitions?.[0];

    if(!c) return;

    const team=
     c.competitors?.find(
      x=>
       String(x.team?.id)===
       String(teamId)
     );

    const opp=
     c.competitors?.find(
      x=>
       String(x.team?.id)!==
       String(teamId)
     );

    if(!team||!opp) return;

    const gf=
     Number(team.score||0);

    const ga=
     Number(opp.score||0);

    let result="D";

    if(
     team.winner===true ||
     gf>ga
    ){

     result="W";

    }else if(gf<ga){

     result="L";

    }

    games.push({

     gf,
     ga,

     result,

     total:
      gf+ga,

     btts:
      gf>0&&ga>0,

     cleanSheet:
      ga===0,

     failedToScore:
      gf===0

    });

   });

   if(games.length){

    const n=games.length;

    const form={

     games,

     wins:
      games.filter(
       x=>x.result==="W"
      ).length,

     draws:
      games.filter(
       x=>x.result==="D"
      ).length,

     losses:
      games.filter(
       x=>x.result==="L"
      ).length,

     gf:
      games.reduce(
       (a,b)=>a+b.gf,
       0
      ),

     ga:
      games.reduce(
       (a,b)=>a+b.ga,
       0
      ),

     over15:
      games.filter(
       x=>x.total>=2
      ).length,

     over25:
      games.filter(
       x=>x.total>=3
      ).length,

     btts:
      games.filter(
       x=>x.btts
      ).length,

     cleanSheets:
      games.filter(
       x=>x.cleanSheet
      ).length,

     failedToScore:
      games.filter(
       x=>x.failedToScore
      ).length,

     avgGF:
      games.reduce(
       (a,b)=>a+b.gf,
       0
      )/n,

     avgGA:
      games.reduce(
       (a,b)=>a+b.ga,
       0
      )/n,

     _ts:Date.now()

    };

    formCache[teamId]=form;

    saveCache();

    return form;

   }

  }catch(e){

   continue;

  }

 }

 return null;

}


/* =========================================================
   HELPERS
   ========================================================= */

function clamp(
 x,
 min,
 max
){

 return Math.max(
  min,
  Math.min(max,x)
 );

}

function pct(x){

 return Math.round(
  clamp(x,1,99)
 );

}

function average(a,b){

 return (a+b)/2;

}


/* =========================================================
   TEAM STRENGTH
   ========================================================= */

function getFormStrength(f){

 if(!f||!f.games?.length){

  return 50;

 }

 const n=f.games.length;

 let strength=50;

 strength +=
  (f.wins/n-.5)*35;

 strength +=
  (f.draws/n-.25)*8;

 strength +=
  clamp(
   (f.avgGF-1.2)*12,
   -12,
   12
  );

 strength -=
  clamp(
   (f.avgGA-1.4)*10,
   -12,
   12
  );

 return clamp(
  strength,
  10,
  90
 );

}


/* =========================================================
   POISSON
   ========================================================= */

function poissonProbability(
 lambda,
 goals
){

 return Math.exp(-lambda)*
  Math.pow(lambda,goals)/
  factorial(goals);

}

function factorial(n){

 let r=1;

 for(let i=2;i<=n;i++){
  r*=i;
 }

 return r;

}

function goalProbability(
 homeLambda,
 awayLambda
){

 let homeWin=0;
 let draw=0;
 let awayWin=0;

 let over15=0;
 let over25=0;
 let btts=0;

 for(let h=0;h<=8;h++){

  for(let a=0;a<=8;a++){

   const p=
    poissonProbability(homeLambda,h)*
    poissonProbability(awayLambda,a);

   if(h>a) homeWin+=p;
   else if(h===a) draw+=p;
   else awayWin+=p;

   if(h+a>=2) over15+=p;
   if(h+a>=3) over25+=p;
   if(h>=1&&a>=1) btts+=p;

  }

 }

 return{

  homeWin:pct(homeWin*100),

  draw:pct(draw*100),

  awayWin:pct(awayWin*100),

  over15:pct(over15*100),

  over25:pct(over25*100),

  btts:pct(btts*100),

  expectedGoals:
   (homeLambda+awayLambda).toFixed(2)

 };

}


/* =========================================================
   BANGO PREDICTION ENGINE
   ========================================================= */

function predict(
 hf,
 af
){

 if(
  !hf ||
  !af ||
  !hf.games?.length ||
  !af.games?.length
 ){

  return{

   enough:false,

   homeWin:0,
   draw:0,
   awayWin:0,

   over15:0,
   over25:0,
   btts:0,

   corners:null,

   confidence:0,

   dataQuality:0,

   sample:0,

   expectedGoals:"--"

  };

 }

 const hStrength=
  getFormStrength(hf);

 const aStrength=
  getFormStrength(af);

 const hAttack=
  clamp(
   hf.avgGF,
   0.25,
   3.5
  );

 const aAttack=
  clamp(
   af.avgGF,
   0.25,
   3.5
  );

 const hDefense=
  clamp(
   hf.avgGA,
   0.25,
   3.5
  );

 const aDefense=
  clamp(
   af.avgGA,
   0.25,
   3.5
  );

 /*
   Home advantage + attacking strength
 */

 let homeLambda=
  0.72+
  hAttack*0.62+
  aDefense*0.28+
  (hStrength-aStrength)*0.008;

 let awayLambda=
  0.48+
  aAttack*0.62+
  hDefense*0.25-
  (hStrength-aStrength)*0.004;

 homeLambda=
  clamp(
   homeLambda,
   0.25,
   3.5
  );

 awayLambda=
  clamp(
   awayLambda,
   0.20,
   3.2
  );

 const base=
  goalProbability(
   homeLambda,
   awayLambda
  );

 /*
   Form-history correction
 */

 const formO15=
  average(
   hf.over15/hf.games.length,
   af.over15/af.games.length
  )*100;

 const formO25=
  average(
   hf.over25/hf.games.length,
   af.over25/af.games.length
  )*100;

 const formBTTS=
  average(
   hf.btts/hf.games.length,
   af.btts/af.games.length
  )*100;

 base.over15=
  pct(
   base.over15*.65+
   formO15*.35
  );

 base.over25=
  pct(
   base.over25*.65+
   formO25*.35
  );

 base.btts=
  pct(
   base.btts*.65+
   formBTTS*.35
  );

 /*
   Result correction from form strength
 */

 const difference=
  clamp(
   hStrength-aStrength,
   -35,
   35
  );

 base.homeWin=
  pct(
   base.homeWin+
   difference*.35+
   3
  );

 base.awayWin=
  pct(
   base.awayWin-
   difference*.25
  );

 base.draw=
  pct(
   100-
   base.homeWin-
   base.awayWin
  );

 /*
   Renormalise 1X2
 */

 const total=
  base.homeWin+
  base.draw+
  base.awayWin;

 base.homeWin=
  pct(base.homeWin/total*100);

 base.draw=
  pct(base.draw/total*100);

 base.awayWin=
  pct(base.awayWin/total*100);

 /*
   Data quality
 */

 const sample=
  Math.min(
   hf.games.length,
   af.games.length
  );

 let quality=40;

 quality+=
  Math.min(sample,10)*4;

 if(sample>=5)
  quality+=8;

 if(sample>=8)
  quality+=5;

 quality=
  Math.round(
   clamp(
    quality,
    1,
    100
   )
  );

 /*
   Model confidence
 */

 let confidence=
  45+
  Math.min(sample,10)*3;

 confidence+=
  Math.abs(
   base.homeWin-
   base.awayWin
  )*.25;

 if(quality<70)
  confidence-=15;

 confidence=
  pct(confidence);

 /*
   Corner engine.
   No fake number.
   Actual corner data will be inserted
   when available from a provider.
 */

 let corners=null;

 /*
   We can still calculate a conservative
   proxy only when actual corner history
   is available.
 */

 if(
  hf.avgCornersFor!=null &&
  af.avgCornersFor!=null
 ){

  const expectedCorners=
   (
    Number(hf.avgCornersFor)+
    Number(af.avgCornersFor)
   )/2;

  corners={

   expected:
    expectedCorners.toFixed(2),

   over15:
    pct(
     clamp(
      expectedCorners/3*100,
      1,
      99
     )
    ),

   over25:
    pct(
     clamp(
      expectedCorners/5*100,
      1,
      99
     )
    )

  };

 }

 return{

  enough:
   sample>=3,

  homeWin:base.homeWin,

  draw:base.draw,

  awayWin:base.awayWin,

  over15:base.over15,

  over25:base.over25,

  btts:base.btts,

  corners,

  confidence,

  dataQuality:quality,

  sample,

  expectedGoals:
   base.expectedGoals

 };

}


/* =========================================================
   ENRICH MATCHES
   ========================================================= */

async function enrichMatches(){

 setStatus(
  "🟡 Building BANGO team profiles..."
 );

 const selected=
  allMatches
  .filter(
   m=>!m.completed
  )
  .slice(0,60);

 let count=0;

 for(const match of selected){

  try{

   const forms=
    await Promise.all([
     getTeamForm(
      match.home.id
     ),
     getTeamForm(
      match.away.id
     )
    ]);

   match.homeForm=forms[0];

   match.awayForm=forms[1];

   match.pred=
    predict(
     forms[0],
     forms[1]
    );

  }catch(e){

   match.pred=
    predict(null,null);

  }

  count++;

  setStatus(
   `🟡 Analysing ${count}/${selected.length} matches...`
  );

 }

 return allMatches;

}


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(
 message,
 type="normal"
){

 const el=
  document.getElementById(
   "status"
  );

 el.className=
  "status "+
  (
   type==="error"
   ?"error"
   :
   type==="warning"
   ?"warning"
   :""
  );

 el.innerHTML=message;

}


/* =========================================================
   DATA QUALITY
   ========================================================= */

function qualityLabel(q){

 if(q>=90)
  return `<span class="good">EXCELLENT</span>`;

 if(q>=80)
  return `<span class="good">GOOD</span>`;

 if(q>=70)
  return `<span class="warn">LIMITED</span>`;

 return `<span class="bad">INSUFFICIENT</span>`;

}


/* =========================================================
   BEST MARKET
   ========================================================= */

function bestMarket(p){

 if(!p||!p.enough)
  return{
   name:"NO BET",
   value:0
  };

 const markets=[

  ["OVER 1.5 GOALS",p.over15],

  ["OVER 2.5 GOALS",p.over25],

  ["BTTS",p.btts],

  ["HOME WIN",p.homeWin],

  ["AWAY WIN",p.awayWin]

 ];

 markets.sort(
  (a,b)=>b[1]-a[1]
 );

 const best=markets[0];

 if(best[1]>=70){

  return{
   name:best[0],
   value:best[1]
  };

 }

 return{
  name:"NO BET",
  value:best[1]
 };

}


/* =========================================================
   FORM
   ========================================================= */

function formatForm(f){

 if(
  !f||
  !f.games
 ){

  return `<span class="small">No form data</span>`;

 }

 return`

 <div class="form">

 ${
  f.games
   .slice(0,5)
   .map(
    g=>`

     <span class="${
      g.result==="W"
      ?"w"
      :
      g.result==="L"
      ?"l"
      :"d"
     }">

      ${g.result}

     </span>

    `
   )
   .join("")
 }

 </div>

 `;

}


/* =========================================================
   MATCH RENDER
   ========================================================= */

function renderMatch(match){

 const p=
  match.pred||
  predict(
   match.homeForm,
   match.awayForm
  );

 const live=
  match.live;

 const status=
  live
  ?
  `<span class="live">
   ● LIVE ${escapeHtml(match.status)}
  </span>`
  :
  displayDate(match.date);

 const best=
  bestMarket(p);

 const corner15=
  p.corners
  ?
  p.corners.over15+"%"
  :
  "N/A";

 const corner25=
  p.corners
  ?
  p.corners.over25+"%"
  :
  "N/A";

 let decision="";

 if(
  p.enough &&
  p.dataQuality>=80 &&
  best.value>=70
 ){

  decision=`

   <div class="best">

    🟢 <b>MODEL SIGNAL</b><br>

    ${best.name}
    <span class="percent">
     ${best.value}%
    </span>

   </div>

  `;

 }else{

  decision=`

   <div class="nobet">

    🟡 <b>NO BET / WATCH</b><br>

    BANGO does not have a strong
    enough combination of probability
    and data quality.

   </div>

  `;

 }

 return`

 <div class="card">

  <div class="matchtop">

   <span>

    <span class="country">
     ${escapeHtml(match.country)}
    </span>

    <span class="league">
     ${escapeHtml(match.league)}
    </span>

   </span>

   <span>
    ${status}
   </span>

  </div>


  <div class="teams">

   <div class="team home">

    ${escapeHtml(
     match.home.name
    )}

   </div>

   <div class="vs">

    ${
     live
     ?
     `<b>
       ${match.home.score}
       -
       ${match.away.score}
      </b>`
     :
     "VS"
    }

   </div>

   <div class="team away">

    ${escapeHtml(
     match.away.name
    )}

   </div>

  </div>


  <div class="predgrid">

   <div class="pred">
    <div class="predtitle">
     HOME WIN
    </div>
    <div class="percent">
     ${p.homeWin}%
    </div>
   </div>

   <div class="pred">
    <div class="predtitle">
     DRAW
    </div>
    <div class="percent">
     ${p.draw}%
    </div>
   </div>

   <div class="pred">
    <div class="predtitle">
     AWAY WIN
    </div>
    <div class="percent">
     ${p.awayWin}%
    </div>
   </div>

   <div class="pred">
    <div class="predtitle">
     OVER 1.5 GOALS
    </div>
    <div class="percent">
     ${p.over15}%
    </div>
   </div>

   <div class="pred">
    <div class="predtitle">
     OVER 2.5 GOALS
    </div>
    <div class="percent">
     ${p.over25}%
    </div>
   </div>

   <div class="pred">
    <div class="predtitle">
     BTTS
    </div>
    <div class="percent">
     ${p.btts}%
    </div>
   </div>

   <div class="pred">
    <div class="predtitle">
     OVER 1.5 CORNERS
    </div>
    <div class="percent">
     ${corner15}
    </div>
   </div>

   <div class="pred">
    <div class="predtitle">
     OVER 2.5 CORNERS
    </div>
    <div class="percent">
     ${corner25}
    </div>
   </div>

  </div>


  ${decision}


  <div class="details">

   <b>Expected Goals:</b>
   ${p.expectedGoals||"--"}

   <br>

   <b>Form Sample:</b>
   ${p.sample||0} matches

   <br>

   <b>Data Quality:</b>
   ${p.dataQuality||0}%
   —
   ${qualityLabel(
    p.dataQuality||0
   )}

   <br>

   <b>Model Confidence:</b>
   ${p.confidence||0}%

   <br>

   <b>Venue:</b>
   ${escapeHtml(
    match.venue||"Not available"
   )}

   <div>
    <b>HOME FORM</b>
    ${formatForm(match.homeForm)}
   </div>

   <div>
    <b>AWAY FORM</b>
    ${formatForm(match.awayForm)}
   </div>

  </div>


  <div class="progress">

   <i style="
    width:${Math.min(
     100,
     p.confidence||0
    )}%
   "></i>

  </div>


  <div class="small">

   Confidence:
   ${p.confidence||0}%

   •

   Data:
   ${p.dataQuality||0}%

  </div>


  <div class="source">

   Source:
   ESPN fixture feed +
   BANGO probability engine

  </div>

 </div>

 `;

}


/* =========================================================
   FILTERING
   ========================================================= */

function render(){

 const container=
  document.getElementById(
   "matches"
  );

 const filter=
  document.getElementById(
   "marketFilter"
  ).value;

 let matches=
  allMatches.filter(
   m=>{

    const d=
     new Date(m.date);

    const target=
     localDate(activeDay);

    if(activeDay===2){

     const start=
      localDate(0);

     const end=
      localDate(2);

     return(
      d>=start &&
      d<=new Date(
       end.getFullYear(),
       end.getMonth(),
       end.getDate(),
       23,59,59
      )
     );

    }

    return(
     d.getDate()===
      target.getDate() &&

     d.getMonth()===
      target.getMonth() &&

     d.getFullYear()===
      target.getFullYear()
    );

   }
  );


 if(filter==="safe"){

  matches=
   matches
   .filter(
    m=>
     m.pred?.enough
   )
   .sort(
    (a,b)=>
     b.pred.confidence-
     a.pred.confidence
   );

 }


 if(filter==="o15"){

  matches=
   matches
   .filter(
    m=>
     m.pred?.over15>=60
   )
   .sort(
    (a,b)=>
     b.pred.over15-
     a.pred.over15
   );

 }


 if(filter==="o25"){

  matches=
   matches
   .filter(
    m=>
     m.pred?.over25>=60
   )
   .sort(
    (a,b)=>
     b.pred.over25-
     a.pred.over25
   );

 }


 if(filter==="btts"){

  matches=
   matches
   .filter(
    m=>
     m.pred?.btts>=60
   )
   .sort(
    (a,b)=>
     b.pred.btts-
     a.pred.btts
   );

 }


 if(filter==="corners"){

  matches=
   matches
   .filter(
    m=>
     m.pred?.corners &&
     m.pred.corners.over15>=60
   )
   .sort(
    (a,b)=>
     b.pred.corners.over15-
     a.pred.corners.over15
   );

 }


 if(filter==="home"){

  matches=
   matches
   .filter(
    m=>
     m.pred?.homeWin>=50
   )
   .sort(
    (a,b)=>
     b.pred.homeWin-
     a.pred.homeWin
   );

 }


 if(filter==="away"){

  matches=
   matches
   .filter(
    m=>
     m.pred?.awayWin>=50
   )
   .sort(
    (a,b)=>
     b.pred.awayWin-
     a.pred.awayWin
   );

 }


 if(!matches.length){

  container.innerHTML=`

   <div class="empty">

    No matches meet this filter.

    <br><br>

    <span class="small">
     Try ALL MATCHES or NEXT 2 DAYS.
    </span>

   </div>

  `;

  return;

 }


 /*
   Country/league hierarchy
 */

 let html="";

 let currentGroup="";

 matches.forEach(match=>{

  const group=
   match.country+
   " • "+
   match.league;

  if(group!==currentGroup){

   currentGroup=group;

   html+=`

    <div class="section">

     🌍
     ${escapeHtml(match.country)}
     —
     ${escapeHtml(match.league)}

    </div>

   `;

  }

  html+=renderMatch(match);

 });

 container.innerHTML=html;

}


/* =========================================================
   DAY
   ========================================================= */

function setDay(
 day,
 button
){

 activeDay=day;

 document
  .querySelectorAll(
   ".filters button"
  )
  .forEach(
   x=>
    x.classList.remove(
     "active"
    )
  );

 button.classList.add(
  "active"
 );

 render();

}


/* =========================================================
   MAIN LOADER
   ========================================================= */

async function loadEverything(){

 document.getElementById(
  "updated"
 ).textContent="--:--";

 allMatches=[];

 document.getElementById(
  "qualifying"
 ).textContent="0";

 document.getElementById(
  "upcoming"
 ).textContent="0";

 document.getElementById(
  "live"
 ).textContent="0";

 try{

  await loadFixtures();

  const live=
   allMatches.filter(
    m=>m.live
   ).length;

  const upcoming=
   allMatches.filter(
    m=>!m.completed
   ).length;

  document.getElementById(
   "upcoming"
  ).textContent=
   upcoming;

  document.getElementById(
   "live"
  ).textContent=
   live;


  if(!allMatches.length){

   setStatus(
    "🔴 No fixtures returned. The data provider or CORS connection may be unavailable.",
    "error"
   );

   render();

   return;

  }


  await enrichMatches();


  const qualifying=
   allMatches.filter(
    m=>
     m.pred?.enough &&
     !m.completed &&
     (m.pred.dataQuality||0)>=70
   ).length;


  document.getElementById(
   "qualifying"
  ).textContent=
   qualifying;


  document.getElementById(
   "updated"
  ).textContent=
   new Date()
   .toLocaleTimeString(
    "en-ZA",
    {
     hour:"2-digit",
     minute:"2-digit"
    }
   );


  setStatus(`

   ✅ BANGO ${VERSION} LIVE

   <br>

   Fixtures:
   <b>${allMatches.length}</b>

   • Live:
   <b>${live}</b>

   • Upcoming:
   <b>${upcoming}</b>

   • Qualifying:
   <b>${qualifying}</b>

  `);


  render();

 }catch(error){

  console.error(error);

  setStatus(
   "🔴 ERROR: "+
   escapeHtml(
    error.message||
    "Unknown error"
   ),
   "error"
  );

 }

}


/* =========================================================
   ESCAPE
   ========================================================= */

function escapeHtml(value){

 return String(value)
  .replace(
   /&/g,
   "&amp;"
  )
  .replace(
   /</g,
   "&lt;"
  )
  .replace(
   />/g,
   "&gt;"
  )
  .replace(
   /"/g,
   "&quot;"
  )
  .replace(
   /'/g,
   "&#039;"
  );

}


/* =========================================================
   AUTO REFRESH
   ========================================================= */

setInterval(
 ()=>loadEverything(),
 5*60*1000
);


/* =========================================================
   START
   ========================================================= */

loadEverything();

</script>
