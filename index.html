<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bango V9</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial;padding:10px}
.h{text-align:center;border:3px solid #0f0;padding:12px;border-radius:12px}
.b{width:100%;padding:12px;background:linear-gradient(#0a0,#040);color:#fff;font-weight:bold;border:none;border-radius:10px;margin:5px 0}
.b2{background:linear-gradient(#a00,#400)}.c{background:#111;border:1px solid #333;border-radius:10px;padding:10px;margin:8px 0}
.ball{display:inline-block;width:26px;height:26px;background:red;color:#fff;text-align:center;line-height:26px;border-radius:50%;margin:2px;font-weight:bold;font-size:12px}
.tab{display:none}.tab.a{display:block}
</style></head><body>
<div class="h"><h1>BANGO V9</h1><p style="color:#0f0">LOTTO + SOCCER</p></div>

<button class="b" onclick="show('lotto')">🎰 LOTTO</button>
<button class="b b2" onclick="show('soccer')">⚽ SOCCER 10 BEST</button>

<div id="lotto" class="tab a">
<div class="c"><b>Daily Lotto</b> - Hot: 21,23,5,7,11 <br><br>
<button class="b" style="background:red" onclick="lotto()">Generate 5 Tickets</button><div id="t"></div></div>
</div>

<div id="soccer" class="tab">
<button class="b" onclick="live()">🔴 REFRESH LIVE</button><div id="s" class="c">Loading...</div>
</div>

<script>
function show(id){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('a'));document.getElementById(id).classList.add('a'); if(id=='soccer') live();}
function lotto(){
 let hot=[21,23,5,7,11,20,15,10],cold=[33,1,2,4]; let out='';
 for(let i=0;i<5;i++){let p=[hot[i],hot[i+2]];while(p.length<5){let n=Math.floor(Math.random()*36)+1;if(!p.includes(n))p.push(n)}p.sort((a,b)=>a-b);out+=`<div style="margin:5px 0">T${i+1}: ${p.map(n=>`<span class=ball>${n}</span>`).join('')} <span style="color:#0f0">${70+Math.floor(Math.random()*20)}%</span></div>`}
 document.getElementById('t').innerHTML=out;
}
const DEMO=[
["Man City vs Arsenal","Over 1.5","82%"],["Bayern vs Dortmund","Over 2.5","85%"],["Real vs Atletico","Over 1.5","78%"],
["Al Hilal vs Al Nassr","Over 2.5","83%"],["Galatasaray vs Fener","Over 1.5","81%"],["Barca vs Sevilla","Home Win","80%"],
["PSG vs Marseille","Over 1.5","79%"],["Ajax vs PSV","Over 2.5","77%"],["Benfica vs Porto","BTTS","74%"],["Inter vs Milan","Over 1.5","72%"]
];
async function live(){
 let el=document.getElementById('s'); el.innerHTML='Loading live...';
 try{
  let today=new Date().toISOString().split('T')[0];
  let r=await fetch(`https://api.football-data.org/v4/matches?dateFrom=${today}&dateTo=${today}`,{headers:{'X-Auth-Token':'03824f7a16ed5d42f891463ace2d0ea7'}});
  let d=await r.json();
  if(d.matches&&d.matches.length>0){
   el.innerHTML=d.matches.slice(0,10).map((m,i)=>`<div class=c><b>${i+1}. ${m.homeTeam.shortName} vs ${m.awayTeam.shortName}</b> - ${m.competition.code}<br>Bet: Over 1.5 @1.4 - 80%</div>`).join('');
  }else{
   el.innerHTML=DEMO.map((x,i)=>`<div class=c><b>${i+1}. ${x[0]}</b><br>Bet: ${x[1]} <span style="float:right;color:#0f0">${x[2]}</span></div>`).join('')+'<p style="font-size:10px;color:#888">Demo today - no live games Sunday</p>';
  }
 }catch(e){ el.innerHTML=DEMO.map((x,i)=>`<div class=c><b>${i+1}. ${x[0]}</b><br>Bet: ${x[1]} <span style="float:right;color:#0f0">${x[2]}</span></div>`).join('');}
}
lotto(); live();
</script></body></html>
