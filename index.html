/* =========================================================

const LEAGUES=[

 {

/* =========================================================
   DATE FUNCTIONS
   ========================================================= */

function localDate(offset=0){

 const d=new Date();

 d.setHours(0,0,0,0);

 d.setDate(
  d.getDate()+offset
 );

 return d;

}


function ymd(d){

 return d.getFullYear()+
 "-" +
 String(
  d.getMonth()+1
 ).padStart(2,"0")+
 "-" +
 String(
  d.getDate()
 ).padStart(2,"0");

}


function displayDate(date){

 return new Date(date).toLocaleString(
  "en-ZA",
  {
   day:"2-digit",
   month:"short",
   hour:"2-digit",
   minute:"2-digit"
  }
 );

}


/* =========================================================
   SAFE JSON
   ========================================================= */

async function readResponse(response){

 const text=
  await response.text();

 if(!text){
  throw new Error("Empty response");
 }

 try{

  return JSON.parse(text);

 }catch(e){

  throw new Error(
   "Invalid JSON response"
  );

 }

}


/* =========================================================
   MULTI SOURCE FETCH
   ========================================================= */

async function fetchReal(url){

 const attempts=[

  {
   name:"ESPN DIRECT",
   url:url
  },

  {
   name:"CORS PROXY 1",
   url:
    "https://corsproxy.io/?"+
    encodeURIComponent(url)
  },

  {
   name:"CORS PROXY 2",
   url:
    "https://api.allorigins.win/raw?url="+
    encodeURIComponent(url)
  }

 ];

 let lastError=null;

 for(
  const attempt of attempts
 ){

  try{

   const controller=
    new AbortController();

   const timer=
    setTimeout(
     ()=>controller.abort(),
     12000
    );

   const response=
    await fetch(
     attempt.url,
     {
      cache:"no-store",
      signal:controller.signal,
      headers:{
       "Accept":
       "application/json"
      }
     }
    );

   clearTimeout(timer);

   if(!response.ok){

    throw new Error(
     "HTTP "+
     response.status
    );

   }

   const data=
    await readResponse(
     response
    );

   if(
    data &&
    typeof data==="object"
   ){

    return{
     data:data,
     source:attempt.name
    };

   }

  }catch(error){

   lastError=error;

  }

 }

 throw lastError||
  new Error(
   "All sources failed"
  );

}


/* =========================================================
   ESPN FIXTURES
   ========================================================= */

async function getLeague(
 league,
 date
){

 const url=
 `https://site.api.espn.com/apis/site/v2/sports/soccer/${league}/scoreboard?dates=${date}`;

 try{

  const result=
   await fetchReal(url);

  return{
   events:
    result.data.events||[],
   source:
    result.source
  };

 }catch(error){

  return{
   events:[],
   source:"FAILED"
  };

 }

}


/* =========================================================
   NORMALISE FIXTURE
   ========================================================= */

function normaliseEvent(
 event,
 league,
 source
){

 const comp=
  event.competitions?.[0];

 if(!comp)
  return null;

 const competitors=
  comp.competitors||[];

 const home=
  competitors.find(
   x=>x.homeAway==="home"
  );

 const away=
  competitors.find(
   x=>x.homeAway==="away"
  );

 if(!home||!away)
  return null;

 const state=
  event.status?.type?.state||
  "";

 const completed=
  !!event.status?.type?.completed;

 return{

  id:String(event.id),

  league:league.name,

  leagueId:league.id,

  country:league.country,

  date:event.date,

  home:{
   id:
    home.team?.id
    ?String(home.team.id)
    :null,

   name:
    home.team?.displayName||
    home.team?.shortDisplayName||
    "Home",

   score:
    Number(home.score||0)
  },

  away:{
   id:
    away.team?.id
    ?String(away.team.id)
    :null,

   name:
    away.team?.displayName||
    away.team?.shortDisplayName||
    "Away",

   score:
    Number(away.score||0)
  },

  state:state,

  completed:completed,

  live:
   state==="in" &&
   !completed,

  status:
   event.status?.type?.shortDetail||
   event.status?.type?.detail||
   "",

  venue:
   comp.venue?.fullName||
   "",

  source:source,

  raw:event

 };

}


/* =========================================================
   FIXTURE LOADER
   ========================================================= */

async function loadFixtures(){

 setStatus(
  "🟡 Searching expanded football fixture network..."
 );

 const dates=[

  ymd(localDate(0)),
  ymd(localDate(1)),
  ymd(localDate(2))

 ];

 const output=[];

 let finished=0;

 /*
   Run in batches.
   This prevents dozens of simultaneous
   requests from destroying the browser.
 */

 const batchSize=6;

 for(
  let start=0;
  start<LEAGUES.length;
  start+=batchSize
 ){

  const batch=
   LEAGUES.slice(
    start,
    start+batchSize
   );

  const jobs=[];

  for(
   const league of batch
  ){

   for(
    const date of dates
   ){

    jobs.push(
     getLeague(
      league.id,
      date
     ).then(
      result=>{

       result.events
        .map(
         event=>
          normaliseEvent(
           event,
           league,
           result.source
          )
        )
        .filter(Boolean)
        .forEach(
         match=>
          output.push(match)
        );

       finished++;

      }
     )
    );

   }

  }

  await Promise.all(jobs);

  setStatus(
   `🟡 Fixture search: ${Math.min(
    finished,
    LEAGUES.length*3
   )}/${LEAGUES.length*3} requests completed...`
  );

 }


 /*
   Remove duplicates.
 */

 const unique=
  new Map();

 output.forEach(
  match=>{

   const key=
    match.id+
    "|" +
    match.home.id+
    "|" +
    match.away.id;

   unique.set(
    key,
    match
   );

  }
 );


 allMatches=
  [...unique.values()]
  .sort(
   (a,b)=>
    new Date(a.date)-
    new Date(b.date)
  );

 return allMatches;

}


/* =========================================================
   CACHE
   ========================================================= */

let formCache={};

try{

 formCache=
  JSON.parse(
   localStorage.getItem(
    CACHE_KEY
   )||"{}"
  );

}catch(e){

 formCache={};

}


function saveCache(){

 try{

  localStorage.setItem(
   CACHE_KEY,
   JSON.stringify(
    formCache
   )
  );

 }catch(e){}

}


/* =========================================================
   HELPERS
   ========================================================= */

function clamp(
 x,
 min,
 max
){

 return Math.max(
  min,
  Math.min(
   max,
   Number(x)||0
  )
 );

}


function pct(x){

 return Math.round(
  clamp(
   x,
   0,
   99
  )
 );

}


function average(a,b){

 return(
  Number(a)+
  Number(b)
 )/2;

}


function factorial(n){

 let r=1;

 for(
  let i=2;
  i<=n;
  i++
 ){
  r*=i;
 }

 return r;

}


function poisson(
 lambda,
 goals
){

 return(
  Math.exp(-lambda)*
  Math.pow(
   lambda,
   goals
  )/
  factorial(goals)
 );

}


/* =========================================================
   FORM
   ========================================================= */

async function getTeamForm(
 teamId
){

 if(!teamId)
  return null;

 const cached=
  formCache[teamId];

 if(
  cached &&
  cached._ts &&
  Date.now()-cached._ts<
  6*60*60*1000
 ){

  return cached;

 }

 /*
   Search team schedule.
 */

 for(
  const league of LEAGUES
 ){

  try{

   const url=
    `https://site.api.espn.com/apis/site/v2/sports/soccer/${league.id}/teams/${teamId}/schedule`;

   const result=
    await fetchReal(url);

   const events=
    result.data.events||[];

   if(!events.length)
    continue;

   const games=[];

   events
    .filter(
     e=>
      e.status?.type?.completed
    )
    .sort(
     (a,b)=>
      new Date(b.date)-
      new Date(a.date)
    )
    .slice(0,10)
    .forEach(
     event=>{

      const c=
       event.competitions?.[0];

      if(!c)
       return;

      const team=
       c.competitors?.find(
        x=>
         String(
          x.team?.id
         )===
         String(teamId)
       );

      const opp=
       c.competitors?.find(
        x=>
         String(
          x.team?.id
         )!==
         String(teamId)
       );

      if(!team||!opp)
       return;

      const gf=
       Number(team.score||0);

      const ga=
       Number(opp.score||0);

      let resultCode="D";

      if(
       team.winner===true||
       gf>ga
      ){

       resultCode="W";

      }else if(gf<ga){

       resultCode="L";

      }

      games.push({

       gf:gf,
       ga:ga,

       result:resultCode,

       total:
        gf+ga,

       btts:
        gf>0 &&
        ga>0,

       over15:
        gf+ga>=2,

       over25:
        gf+ga>=3,

       cleanSheet:
        ga===0,

       failedToScore:
        gf===0,

       eventId:
        String(event.id)

      });

     }
    );

   if(!games.length)
    continue;

   const n=
    games.length;

   const form={

    games:games,

    wins:
     games.filter(
      x=>x.result==="W"
     ).length,

    draws:
     games.filter(
      x=>x.result==="D"
     ).length,

    losses:
     games.filter(
      x=>x.result==="L"
     ).length,

    gf:
     games.reduce(
      (a,b)=>a+b.gf,
      0
     ),

    ga:
     games.reduce(
      (a,b)=>a+b.ga,
      0
     ),

    over15:
     games.filter(
      x=>x.over15
     ).length,

    over25:
     games.filter(
      x=>x.over25
     ).length,

    btts:
     games.filter(
      x=>x.btts
     ).length,

    cleanSheets:
     games.filter(
      x=>x.cleanSheet
     ).length,

    failedToScore:
     games.filter(
      x=>x.failedToScore
     ).length,

    avgGF:
     games.reduce(
      (a,b)=>a+b.gf,
      0
     )/n,

    avgGA:
     games.reduce(
      (a,b)=>a+b.ga,
      0
     )/n,

    avgCornersFor:null,

    avgCornersAgainst:null,

    cornerSample:0,

    source:
     result.source,

    _ts:
     Date.now()

   };

   formCache[teamId]=form;

   saveCache();

   return form;

  }catch(error){

   continue;

  }

 }

 return null;

}


/* =========================================================
   CORNER DATA
   ========================================================= */

async function getCornerData(
 form
){

 if(
  !form||
  !form.games||
  !form.games.length
 ){

  return form;

 }

 /*
   Do not make repeated corner requests
   if we already have them.
 */

 if(
  form.cornerSample>=3 &&
  form.avgCornersFor!=null
 ){

  return form;

 }

 const cornerGames=[];

 /*
   Only inspect the latest 5 games.
 */

 const games=
  form.games.slice(0,5);

 for(
  const game of games
 ){

  if(!game.eventId)
   continue;

  try{

   const url=
    `https://site.api.espn.com/apis/site/v2/sports/soccer/summary?event=${game.eventId}`;

   const result=
    await fetchReal(url);

   const data=
    result.data;

   const teams=
    data?.boxscore?.teams||
    [];

   let teamStats=null;

   teams.forEach(
    block=>{

     const teamId=
      block.team?.id;

     const stats=
      block.statistics||
      [];

     if(
      stats.some(
       s=>
        String(
         s.name||
         s.label||
         ""
        )
        .toLowerCase()
        .includes("corner")
      )
     ){

      teamStats=block;

     }

    }
   );

   if(!teamStats)
    continue;

   const stats=
    teamStats.statistics||
    [];

   const corner=
    stats.find(
     s=>
      String(
       s.name||
       s.label||
       ""
      )
      .toLowerCase()
      .includes("corner")
    );

   if(!corner)
    continue;

   const value=
    Number(
     corner.displayValue||
     corner.value||
     0
    );

   if(
    Number.isFinite(value)
   ){

    cornerGames.push({
     value:value
    });

   }

  }catch(e){

   continue;

  }

 }

 if(cornerGames.length>=3){

  form.avgCornersFor=
   cornerGames.reduce(
    (a,b)=>a+b.value,
    0
   )/
   cornerGames.length;

  form.cornerSample=
   cornerGames.length;

  form.cornerSource=
   "ESPN match statistics";

  form._ts=
   Date.now();

  saveCache();

 }

 return form;

}


/* =========================================================
   STRENGTH
   ========================================================= */

function getFormStrength(
 f
){

 if(
  !f||
  !f.games||
  !f.games.length
 ){

  return 50;

 }

 const n=
  f.games.length;

 let strength=50;

 /*
   Results.
 */

 strength+=
  (f.wins/n-.5)*
  32;

 strength+=
  (f.draws/n-.25)*
  8;

 /*
   Attack.
 */

 strength+=
  clamp(
   (f.avgGF-1.2)*
   13,
   -15,
   15
  );

 /*
   Defence.
 */

 strength-=
  clamp(
   (f.avgGA-1.4)*
   10,
   -15,
   15
  );

 return clamp(
  strength,
  10,
  90
 );

}


/* =========================================================
   POISSON ENGINE
   ========================================================= */

function goalProbability(
 homeLambda,
 awayLambda
){

 let homeWin=0;
 let draw=0;
 let awayWin=0;

 let over15=0;
 let over25=0;
 let btts=0;

 for(
  let h=0;
  h<=10;
  h++
 ){

  for(
   let a=0;
   a<=10;
   a++
  ){

   const probability=
    poisson(
     homeLambda,
     h
    )*
    poisson(
     awayLambda,
     a
    );

   if(h>a)
    homeWin+=probability;

   else if(h===a)
    draw+=probability;

   else
    awayWin+=probability;

   if(h+a>=2)
    over15+=probability;

   if(h+a>=3)
    over25+=probability;

   if(
    h>=1 &&
    a>=1
   )
    btts+=probability;

  }

 }

 return{

  homeWin:
   homeWin*100,

  draw:
   draw*100,

  awayWin:
   awayWin*100,

  over15:
   over15*100,

  over25:
   over25*100,

  btts:
   btts*100,

  expectedGoals:
   (
    homeLambda+
    awayLambda
   ).toFixed(2)

 };

}


/* =========================================================
   CORNER PROBABILITY
   ========================================================= */

function cornerProbability(
 homeForm,
 awayForm
){

 if(
  !homeForm||
  !awayForm
 ){

  return null;

 }

 if(
  homeForm.avgCornersFor==null||
  awayForm.avgCornersFor==null
 ){

  return null;

 }

 const expected=
  (
   Number(
    homeForm.avgCornersFor
   )+
   Number(
    awayForm.avgCornersFor
   )
  )/2;

 /*
   Conservative Poisson calculation.
 */

 function over(
  lambda,
  line
 ){

  let under=0;

  for(
   let i=0;
   i<=Math.floor(line);
   i++
  ){

   under+=
    poisson(
     lambda,
     i
    );

  }

  return(
   1-under
  )*100;

 }

 return{

  expected:
   expected.toFixed(2),

  sample:
   Math.min(
    homeForm.cornerSample||0,
    awayForm.cornerSample||0
   ),

  over15:
   pct(
    over(
     expected,
     1
    )
   ),

  over25:
   pct(
    over(
     expected,
     2
    )
   ),

  over35:
   pct(
    over(
     expected,
     3
    )
   ),

  source:
   "Actual ESPN corner statistics"

 };

}


/* =========================================================
   MAIN PREDICTION ENGINE
   ========================================================= */

function predict(
 hf,
 af
){

 if(
  !hf||
  !af||
  !hf.games||
  !af.games||
  hf.games.length<3||
  af.games.length<3
 ){

  return{

   enough:false,

   homeWin:0,
   draw:0,
   awayWin:0,

   over15:0,
   over25:0,
   btts:0,

   corners:null,

   confidence:0,

   dataQuality:0,

   sample:0,

   expectedGoals:"--"

  };

 }

 const hs=
  getFormStrength(hf);

 const as=
  getFormStrength(af);

 const hAttack=
  clamp(
   hf.avgGF,
   .25,
   3.5
  );

 const aAttack=
  clamp(
   af.avgGF,
   .25,
   3.5
  );

 const hDefense=
  clamp(
   hf.avgGA,
   .25,
   3.5
  );

 const aDefense=
  clamp(
   af.avgGA,
   .25,
   3.5
  );

 /*
   Expected goals.

   Home gets a modest home advantage.
   Defence of opponent is included.
 */

 let homeLambda=
  .55+
  hAttack*.60+
  aDefense*.30+
  (hs-as)*.008;

 let awayLambda=
  .35+
  aAttack*.60+
  hDefense*.25-
  (hs-as)*.004;

 homeLambda=
  clamp(
   homeLambda,
   .25,
   3.5
  );

 awayLambda=
  clamp(
   awayLambda,
   .20,
   3.2
  );

 const base=
  goalProbability(
   homeLambda,
   awayLambda
  );

 /*
   Historical form blend.
 */

 const formO15=
  average(
   hf.over15/
   hf.games.length,

   af.over15/
   af.games.length
  )*100;

 const formO25=
  average(
   hf.over25/
   hf.games.length,

   af.over25/
   af.games.length
  )*100;

 const formBTTS=
  average(
   hf.btts/
   hf.games.length,

   af.btts/
   af.games.length
  )*100;

 base.over15=
  base.over15*.70+
  formO15*.30;

 base.over25=
  base.over25*.70+
  formO25*.30;

 base.btts=
  base.btts*.70+
  formBTTS*.30;


 /*
   1X2 strength correction.
 */

 const difference=
  clamp(
   hs-as,
   -40,
   40
  );

 base.homeWin+=
  difference*.32+
  3;

 base.awayWin-=
  difference*.24;

 base.homeWin=
  Math.max(
   1,
   base.homeWin
  );

 base.awayWin=
  Math.max(
   1,
   base.awayWin
  );

 base.draw=
  Math.max(
   1,
   100-
   base.homeWin-
   base.awayWin
  );

 /*
   Renormalise.
 */

 const resultTotal=
  base.homeWin+
  base.draw+
  base.awayWin;

 const homeWin=
  pct(
   base.homeWin/
   resultTotal*
   100
  );

 const draw=
  pct(
   base.draw/
   resultTotal*
   100
  );

 const awayWin=
  pct(
   base.awayWin/
   resultTotal*
   100
  );

 /*
   Data quality.
 */

 const sample=
  Math.min(
   hf.games.length,
   af.games.length
  );

 let quality=35;

 quality+=
  Math.min(
   sample,
   10
  )*4;

 if(
  hf.cornerSample>=3 &&
  af.cornerSample>=3
 ){

  quality+=8;

 }

 if(
  hf.source||
  af.source
 ){

  quality+=5;

 }

 quality=
  Math.round(
   clamp(
    quality,
    1,
    100
   )
  );

 /*
   Confidence is deliberately conservative.
 */

 let confidence=
  40+
  Math.min(
   sample,
   10
  )*3;

 confidence+=
  Math.abs(
   homeWin-awayWin
  )*.22;

 confidence+=
  Math.max(
   0,
   base.over15-60
  )*.05;

 if(quality<70)
  confidence-=12;

 confidence=
  pct(confidence);

 const corners=
  cornerProbability(
   hf,
   af
  );

 return{

  enough:
   sample>=3,

  homeWin,
  draw,
  awayWin,

  over15:
   pct(base.over15),

  over25:
   pct(base.over25),

  btts:
   pct(base.btts),

  corners,

  confidence,

  dataQuality:
   quality,

  sample,

  expectedGoals:
   base.expectedGoals

 };

}


/* =========================================================
   ENRICH MATCHES
   ========================================================= */

async function enrichMatches(){

 const selected=
  allMatches
   .filter(
    m=>!m.completed
   )
   .slice(0,80);

 if(!selected.length)
  return;

 setStatus(
  `🟡 Building team profiles: 0/${selected.length}...`
 );

 let count=0;

 /*
   Process sequentially enough to avoid
   hammering public endpoints.
 */

 for(
  const match of selected
 ){

  try{

   const forms=
    await Promise.all([
     getTeamForm(
      match.home.id
     ),
     getTeamForm(
      match.away.id
     )
    ]);

   match.homeForm=forms[0];
   match.awayForm=forms[1];

   /*
     Corner statistics are optional.
     Failure here does NOT destroy
     the prediction.
   */

   if(
    forms[0] &&
    forms[1]
   ){

    await Promise.all([
     getCornerData(
      forms[0]
     ),
     getCornerData(
      forms[1]
     )
    ]);

   }

   match.pred=
    predict(
     forms[0],
     forms[1]
    );

  }catch(error){

   match.pred=
    predict(
     null,
     null
    );

  }

  count++;

  setStatus(
   `🟡 Analysing matches: ${count}/${selected.length}...`
  );

 }

 return allMatches;

}

/* =========================================================
   QUALITY LABEL
   ========================================================= */

function qualityLabel(q){

 if(q>=90)
  return `<span class="good">EXCELLENT</span>`;

 if(q>=80)
  return `<span class="good">GOOD</span>`;

 if(q>=70)
  return `<span class="warn">LIMITED</span>`;

 return `<span class="bad">INSUFFICIENT</span>`;

}


/* =========================================================
   BEST MARKET
   ========================================================= */

function bestMarket(p){

 if(
  !p||
  !p.enough||
  p.dataQuality<70
 ){

  return{
   name:"NO BET",
   value:0
  };

 }

 const markets=[

  ["OVER 1.5 GOALS",p.over15],

  ["OVER 2.5 GOALS",p.over25],

  ["BTTS",p.btts],

  ["HOME WIN",p.homeWin],

  ["AWAY WIN",p.awayWin]

 ];

 /*
   Only include corners if
   actual corner data exists.
 */

 if(
  p.corners &&
  p.corners.over15!=null
 ){

  markets.push(
   [
    "OVER 1.5 CORNERS",
    p.corners.over15
   ]
  );

 }

 markets.sort(
  (a,b)=>
   b[1]-a[1]
 );

 const best=
  markets[0];

 if(
  best[1]>=70
 ){

  return{
   name:best[0],
   value:best[1]
  };

 }

 return{
  name:"NO BET",
  value:best[1]
 };

}

   .join("")
 }

 </div>

 `;

}

/* =========================================================
   DATE FILTER
   ========================================================= */

function matchBelongsToDay(
 match
){

 const d=
  new Date(
   match.date
  );

 if(activeDay===3){

  return true;

 }

 if(activeDay===2){

  const start=
   localDate(0);

  const end=
   localDate(2);

  end.setHours(
   23,59,59,999
  );

  return(
   d>=start &&
   d<=end
  );

 }

 const target=
  localDate(
   activeDay
  );

 return(
  d.getFullYear()===
   target.getFullYear() &&

  d.getMonth()===
   target.getMonth() &&

  d.getDate()===
   target.getDate()
 );

}
