<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BANGO V32.1 • Fixed</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050505;color:#eee;font-family:Arial,Helvetica,sans-serif;padding:10px}
h1{text-align:center;color:#00ff66;font-size:38px;margin:12px 0 4px}
.subtitle{text-align:center;color:#aaa;font-size:14px;line-height:1.5}
.wrap{max-width:1100px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.box{background:#101010;border:1px solid #292929;border-radius:18px;padding:16px 8px;text-align:center}
.big{color:#00ff66;font-size:30px;font-weight:bold}
.label{color:#aaa;font-size:12px;margin-top:5px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
button,select{width:100%;min-height:55px;border-radius:15px;border:1px solid #333;background:#111;color:#fff;font-size:16px;padding:10px}
button{background:#00bd59;color:#fff;font-weight:bold;border:0}
button:active{transform:scale(.98)}
.status{border-left:5px solid #00ff66;background:#0e0e0e;border-radius:15px;padding:15px;margin:12px 0;line-height:1.5}
.error{border-left-color:#ff3030}
.warning{border-left-color:#ffb000}
.filters{display:flex;gap:7px;overflow-x:auto;margin:12px 0}
.filters button{min-width:115px;min-height:43px;background:#151515;border:1px solid #333}
.filters button.active{background:#00bd59;border-color:#00ff66}
.card{background:#101010;border:1px solid #292929;border-radius:18px;padding:16px;margin:12px 0}
.matchtop{display:flex;justify-content:space-between;gap:10px;color:#aaa;font-size:12px}
.league{color:#00ff66;font-weight:bold}
.teams{display:grid;grid-template-columns:1fr 55px 1fr;align-items:center;gap:7px;margin:15px 0}
.team{font-size:18px;font-weight:bold}
.home{text-align:right}.away{text-align:left}
.vs{text-align:center;color:#777;font-size:12px}
.percent{color:#00ff66;font-size:21px;font-weight:bold}
.predgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pred{background:#171717;border-radius:12px;padding:10px;border:1px solid #282828}
.predtitle{color:#aaa;font-size:11px}
.form{display:flex;gap:4px;margin-top:8px}
.form span{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#222;font-size:11px}
.form.w{background:#087d3c}.form.d{background:#555}.form.l{background:#8b1d1d}
.details{color:#999;font-size:12px;line-height:1.6;margin-top:10px}
.progress{height:5px;background:#222;border-radius:10px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:#00ff66}
.empty{text-align:center;color:#777;padding:50px 15px}
.small{font-size:11px;color:#777}
.live{color:#ff3030;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.45}}
</style>
</head>
<body>
<div class="wrap">
<h1>⚽ BANGO V32.1 FIXED</h1>
<div class="subtitle">REAL FIXTURES • CORS FIX • CACHED FORM • PSL INCLUDED</div>
<div class="grid">
 <div class="box"><div class="big" id="qualifying">0</div><div class="label">QUALIFYING</div></div>
 <div class="box"><div class="big" id="upcoming">0</div><div class="label">UPCOMING</div></div>
 <div class="box"><div class="big" id="live">0</div><div class="label">LIVE</div></div>
 <div class="box"><div class="big" id="updated">--:--</div><div class="label">UPDATED</div></div>
</div>
<div class="controls">
 <button onclick="loadEverything()">🔄 REFRESH REAL DATA</button>
 <select id="marketFilter" onchange="render()">
  <option value="all">All Matches</option>
  <option value="safe">Highest Confidence</option>
  <option value="goals">Over 1.5 Goals</option>
  <option value="btts">BTTS</option>
  <option value="home">Home Win</option>
  <option value="away">Away Win</option>
 </select>
</div>
<div id="status" class="status">🟡 Ready...</div>
<div class="filters">
 <button class="active" onclick="setDay(0,this)">TODAY</button>
 <button onclick="setDay(1,this)">TOMORROW</button>
 <button onclick="setDay(2,this)">NEXT 2 DAYS</button>
</div>
<div id="matches"></div>
</div>
<script>
const LEAGUES=[
 {id:"eng.1",name:"Premier League"},
 {id:"esp.1",name:"La Liga"},
 {id:"ger.1",name:"Bundesliga"},
 {id:"ita.1",name:"Serie A"},
 {id:"fra.1",name:"Ligue 1"},
 {id:"rsa.1",name:"PSL - South Africa"},
 {id:"uefa.champions",name:"Champions League"},
 {id:"uefa.europa",name:"Europa League"},
 {id:"eng.2",name:"Championship"},
 {id:"ned.1",name:"Eredivisie"}
];
let allMatches=[];let activeDay=0;
function localDate(o=0){const d=new Date();d.setDate(d.getDate()+o);return d;}
function ymd(d){return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");}
function displayDate(date){return new Date(date).toLocaleString("en-ZA",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});}
async function fetchWithProxy(url){
 const proxies=[u=>`https://corsproxy.io/?${encodeURIComponent(u)}`,u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,u=>u];
 for(const p of proxies){
  try{
   const r=await fetch(p(url),{cache:"no-store",signal:AbortSignal.timeout(12000)});
   if(!r.ok) throw new Error("http "+r.status);
   const j=await r.json();
   if(j.events||j.events===null) return j;
   if(j.contents){try{return JSON.parse(j.contents);}catch{}}
   return j;
  }catch(e){continue;}
 }
 throw new Error("All proxies failed");
}
async function getLeague(league,date){
 const url=`https://site.api.espn.com/apis/site/v2/sports/soccer/${league}/scoreboard?dates=${date}`;
 try{const data=await fetchWithProxy(url);return data.events||[];}catch(e){return [];}
}
function normaliseEvent(event,leagueName){
 const comp=event.competitions&&event.competitions[0];if(!comp) return null;
 const competitors=comp.competitors||[];
 const home=competitors.find(x=>x.homeAway==="home");const away=competitors.find(x=>x.homeAway==="away");
 if(!home||!away) return null;
 return{id:event.id,league:leagueName,date:event.date,home:{id:home.team?.id,name:home.team?.displayName,score:Number(home.score||0)},away:{id:away.team?.id,name:away.team?.displayName,score:Number(away.score||0)},state:event.status?.type?.state||"",completed:!!event.status?.type?.completed,live:event.status?.type?.state==="in"&&!event.status?.type?.completed,status:event.status?.type?.shortDetail||"",venue:comp.venue?.fullName||""};
}
async function loadFixtures(){
 setStatus("🟡 Loading real fixtures...");
 const dates=[ymd(localDate(0)),ymd(localDate(1)),ymd(localDate(2))];
 let output=[];
 for(const date of dates){
  const reqs=LEAGUES.map(l=>getLeague(l.id,date).then(ev=>ev.map(e=>normaliseEvent(e,l.name)).filter(Boolean)));
  const res=await Promise.all(reqs);res.forEach(list=>output.push(...list));
 }
 const unique=new Map();output.forEach(m=>unique.set(m.id,m));
 allMatches=[...unique.values()].sort((a,b)=>new Date(a.date)-new Date(b.date));
 return allMatches;
}
const formCache=JSON.parse(localStorage.getItem("bango_form_v32")||"{}");
function saveCache(){localStorage.setItem("bango_form_v32",JSON.stringify(formCache));}
async function getTeamForm(teamId){
 if(!teamId) return null;
 if(formCache[teamId]&&Date.now()-formCache[teamId]._ts<1000*60*60*6) return formCache[teamId];
 for(const league of LEAGUES){
  try{
   const url=`https://site.api.espn.com/apis/site/v2/sports/soccer/${league.id}/teams/${teamId}/schedule`;
   const data=await fetchWithProxy(url);const events=data.events||[];if(!events.length) continue;
   const games=[];events.filter(e=>e.status?.type?.completed).sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,10).forEach(event=>{
    const c=event.competitions?.[0];if(!c) return;
    const team=c.competitors?.find(x=>String(x.team?.id)===String(teamId));const opp=c.competitors?.find(x=>String(x.team?.id)!==String(teamId));
    if(!team||!opp) return;const gf=Number(team.score||0);const ga=Number(opp.score||0);let r="D";if(team.winner===true||gf>ga) r="W";else if(gf<ga) r="L";games.push({gf,ga,result:r,total:gf+ga,btts:gf>0&&ga>0});
   });
   if(games.length){const form={games,wins:games.filter(x=>x.result==="W").length,draws:games.filter(x=>x.result==="D").length,losses:games.filter(x=>x.result==="L").length,gf:games.reduce((a,b)=>a+b.gf,0),ga:games.reduce((a,b)=>a+b.ga,0),over15:games.filter(x=>x.total>=2).length,btts:games.filter(x=>x.btts).length,_ts:Date.now()};formCache[teamId]=form;saveCache();return form;}
  }catch(e){continue;}
 }
 return null;
}
function clamp(x,min,max){return Math.max(min,Math.min(max,x));}
function pct(x){return Math.round(clamp(x,1,99));}
function getFormStrength(f){if(!f||!f.games.length) return 50;const n=f.games.length;let s=50;s+=(f.wins/n-.5)*35;s+=(f.draws/n-.25)*8;s+=clamp((f.gf/n-1.2)*10,-10,10);s-=clamp((f.ga/n-1.4)*8,-10,10);return clamp(s,10,90);}
function predict(hf,af){if(!hf||!af) return{enough:false,homeWin:50,draw:25,awayWin:25,over15:55,btts:50,corners:86,confidence:0};const h=getFormStrength(hf);const a=getFormStrength(af);const edge=clamp((h-a)+7,-25,30);let hw=45+edge*.75;let aw=30-edge*.45;let dr=100-hw-aw;const eg=(hf.gf/Math.max(1,hf.games.length)+af.gf/Math.max(1,af.games.length)+hf.ga/Math.max(1,hf.games.length)+af.ga/Math.max(1,af.games.length))/2;let o15=45+eg*20;const ho=(hf.over15/Math.max(1,hf.games.length)+af.over15/Math.max(1,af.games.length))/2;o15=o15*.55+ho*100*.45;const br=(hf.btts/Math.max(1,hf.games.length)+af.btts/Math.max(1,af.games.length))/2;let btts=br*100*.70+clamp(eg*22,0,90)*.30;hw=pct(hw);aw=pct(aw);dr=pct(dr);o15=pct(o15);btts=pct(btts);const tot=hw+dr+aw;hw=pct(hw/tot*100);dr=pct(dr/tot*100);aw=pct(aw/tot*100);const sample=Math.min(hf.games.length,af.games.length);return{enough:sample>=3,homeWin:hw,draw:dr,awayWin:aw,over15:o15,btts,corners:86,confidence:pct(45+sample*4+Math.abs(hw-aw)*.35),sample,expectedGoals:eg.toFixed(2)};}
async function enrichMatches(){setStatus("🟡 Analysing team form...");const sel=allMatches.filter(m=>!m.completed).slice(0,40);let c=0;for(const m of sel){try{const f=await Promise.all([getTeamForm(m.home.id),getTeamForm(m.away.id)]);m.homeForm=f[0];m.awayForm=f[1];m.pred=predict(f[0],f[1]);}catch(e){m.pred=predict(null,null);}c++;setStatus(`🟡 Analysing form ${c}/${sel.length}...`);}return allMatches;}
function setStatus(msg,type="normal"){const el=document.getElementById("status");el.className="status "+(type==="error"?"error":type==="warning"?"warning":"");el.innerHTML=msg;}
function render(){
 const cont=document.getElementById("matches");const filter=document.getElementById("marketFilter").value;
 let ms=allMatches.filter(m=>{const d=new Date(m.date);const today=localDate(activeDay);if(activeDay===2){const s=localDate(0);const e=localDate(2);return d>=s&&d<=new Date(e.getFullYear(),e.getMonth(),e.getDate(),23,59,59);}return d.getDate()===today.getDate()&&d.getMonth()===today.getMonth()&&d.getFullYear()===today.getFullYear();});
 if(filter==="safe") ms=ms.filter(m=>m.pred&&m.pred.enough).sort((a,b)=>Math.max(b.pred.over15,b.pred.btts,b.pred.homeWin,b.pred.awayWin)-Math.max(a.pred.over15,a.pred.btts,a.pred.homeWin,a.pred.awayWin));
 else if(filter==="goals") ms=ms.filter(m=>m.pred&&m.pred.over15>=60).sort((a,b)=>b.pred.over15-a.pred.over15);
 else if(filter==="btts") ms=ms.filter(m=>m.pred&&m.pred.btts>=60).sort((a,b)=>b.pred.btts-a.pred.btts);
 else if(filter==="home") ms=ms.filter(m=>m.pred&&m.pred.homeWin>=50).sort((a,b)=>b.pred.homeWin-a.pred.homeWin);
 else if(filter==="away") ms=ms.filter(m=>m.pred&&m.pred.awayWin>=50).sort((a,b)=>b.pred.awayWin-a.pred.awayWin);
 if(!ms.length){cont.innerHTML=`<div class="empty">No matches meet this filter.<br><span class="small">Try NEXT 2 DAYS</span></div>`;return;}
 cont.innerHTML=ms.map(renderMatch).join("");
}
function renderMatch(m){const p=m.pred||predict(m.homeForm,m.awayForm);const isLive=m.live;const status=isLive?`<span class="live">● LIVE ${m.status}</span>`:displayDate(m.date);let best="NO BET";let bp=0;if(p.enough){const mk=[["OVER 1.5 GOALS",p.over15],["BTTS",p.btts],["HOME WIN",p.homeWin],["AWAY WIN",p.awayWin]];mk.sort((a,b)=>b[1]-a[1]);if(mk[0][1]>=65){best=mk[0][0];bp=mk[0][1];}}const hf=formatForm(m.homeForm);const af=formatForm(m.awayForm);return `<div class="card"><div class="matchtop"><span class="league">${escapeHtml(m.league)}</span><span>${status}</span></div><div class="teams"><div class="team home">${escapeHtml(m.home.name)}</div><div class="vs">${isLive?`${m.home.score} - ${m.away.score}`:"VS"}</div><div class="team away">${escapeHtml(m.away.name)}</div></div><div class="predgrid"><div class="pred"><div class="predtitle">1X2 HOME</div><div class="percent">${p.homeWin}%</div></div><div class="pred"><div class="predtitle">DRAW</div><div class="percent">${p.draw}%</div></div><div class="pred"><div class="predtitle">1X2 AWAY</div><div class="percent">${p.awayWin}%</div></div><div class="pred"><div class="predtitle">OVER 1.5 GOALS</div><div class="percent">${p.over15}%</div></div><div class="pred"><div class="predtitle">OVER 1.5 CORNERS</div><div class="percent">${p.corners}%</div></div><div class="pred"><div class="predtitle">BTTS</div><div class="percent">${p.btts}%</div></div></div><div class="details"><b>BEST:</b> ${bp?`<span class="percent">${best} ${bp}%</span>`:`<span style="color:#ffb000">NO BET</span>`}<br>Expected: <b>${p.expectedGoals||"--"}</b> • Sample: <b>${p.sample||0}</b><div>HOME ${hf}</div><div>AWAY ${af}</div></div><div class="progress"><i style="width:${Math.min(100,p.confidence||0)}%"></i></div><div class="small">Confidence: ${p.confidence||0}%</div></div>`;}
function formatForm(f){if(!f||!f.games) return `<span class="small">No data</span>`;return `<span class="form">${f.games.slice(0,5).map(g=>`<span class="${g.result==="W"?"w":g.result==="L"?"l":"d"}">${g.result}</span>`).join("")}</span>`;}
function escapeHtml(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
function setDay(d,b){activeDay=d;document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("active"));b.classList.add("active");render();}
async function loadEverything(){
 document.getElementById("updated").textContent="--:--";allMatches=[];
 try{
  await loadFixtures();const live=allMatches.filter(m=>m.live).length;const up=allMatches.filter(m=>!m.completed).length;
  if(!allMatches.length){setStatus("🔴 0 fixtures — ESPN has no games for these dates or proxy blocked. Try NEXT 2 DAYS.","error");render();return;}
  await enrichMatches();const qual=allMatches.filter(m=>m.pred&&m.pred.enough&&!m.completed).length;
  document.getElementById("qualifying").textContent=qual;document.getElementById("upcoming").textContent=up;document.getElementById("live").textContent=live;
  document.getElementById("updated").textContent=new Date().toLocaleTimeString("en-ZA",{hour:"2-digit",minute:"2-digit"});
  setStatus(`✅ Done — ${live} live, ${up} upcoming, ${qual} qualifying.`);
  render();
 }catch(e){setStatus("🔴 ERROR: "+escapeHtml(e.message),"error");}
}
setInterval(()=>loadEverything(),5*60*1000);
loadEverything();
</script>
</body>
  </html>
