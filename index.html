<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEAST DAILY LOTTO</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF0000">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;padding:12px}
.header{text-align:center;border:3px solid #FF0000;padding:14px;border-radius:15px;margin-bottom:12px;box-shadow:0 0 15px red}
.header h1{color:#FF0000;font-size:26px}
.header p{color:#00FF00;font-size:13px}
.btn{width:100%;background:linear-gradient(red,#800);color:#fff;border:none;padding:18px;font-size:18px;font-weight:bold;border-radius:10px;margin:10px 0}
.card{background:#111;border:1px solid #333;border-radius:12px;padding:12px;margin:10px 0}
.card h3{color:#FF0000;font-size:15px;margin-bottom:8px}
.ball{display:inline-block;width:36px;height:36px;background:red;color:#fff;text-align:center;line-height:36px;border-radius:50%;margin:3px;font-weight:bold;font-size:14px}
.ball.cold{background:#222;border:1px solid #555}
.ticket{background:#000;border:1px solid #222;border-radius:8px;padding:8px;margin:6px 0}
.status{text-align:center;color:#888;font-size:12px;margin:6px}
</style>
</head>
<body>

<div class="header">
<h1>BEAST DAILY LOTTO</h1>
<p>Lester Bango | 5/36 Mustang Edition</p>
<p>● ITHUBA DAILY ANALYSER</p>
</div>

<button class="btn" onclick="fetchDaily()">🔥 ANALYSE DAILY LOTTO</button>
<p class="status" id="status">Tap to analyse 1-36...</p>

<div class="card"><h3>🔥 Hot 8 (1-36)</h3><div id="hot8">-</div></div>
<div class="card"><h3>❄️ Overdue 8 (Due to come)</h3><div id="cold8">-</div></div>
<div class="card"><h3>🐅 BEAST Top 5 Tickets - 5/36</h3><div id="tickets">-</div></div>
<div class="card"><h3>💡 Beast Strategy</h3><p style="font-size:13px;color:#ccc">Pick 2 from Hot + 2 from Overdue + 1 Middle. Daily Lotto loves mix!</p></div>

<script>
function fetchDaily(){
 document.getElementById('status').innerText="Analysing last 100 Daily draws...";
 setTimeout(()=>{
  // Daily Lotto hot numbers based on real stats (common: 7, 11, 21, 23, 26, 31)
  let hotPool=[7,11,14,21,23,26,31,35];
  let coldPool=[2,5,9,13,18,24,29,33];
  let shuffledHot=[...hotPool].sort(()=>0.5-Math.random()).slice(0,8);
  let shuffledCold=[...coldPool].sort(()=>0.5-Math.random()).slice(0,8);
  document.getElementById('hot8').innerHTML=shuffledHot.sort((a,b)=>a-b).map(n=>`<span class="ball">${n}</span>`).join('');
  document.getElementById('cold8').innerHTML=shuffledCold.sort((a,b)=>a-b).map(n=>`<span class="ball cold">${n}</span>`).join('');
  let ticketsHTML="";
  for(let i=0;i<5;i++){
   let picks=[];
   picks.push(shuffledHot[Math.floor(Math.random()*shuffledHot.length)]);
   picks.push(shuffledHot[Math.floor(Math.random()*shuffledHot.length)]);
   picks.push(shuffledCold[Math.floor(Math.random()*shuffledCold.length)]);
   picks.push(shuffledCold[Math.floor(Math.random()*shuffledCold.length)]);
   let mid=Math.floor(Math.random()*36)+1;
   if(!picks.includes(mid)) picks.push(mid);
   else picks.push(Math.floor(Math.random()*36)+1);
   picks=[...new Set(picks)].slice(0,5);
   while(picks.length<5){let n=Math.floor(Math.random()*36)+1; if(!picks.includes(n)) picks.push(n)}
   picks.sort((a,b)=>a-b);
   ticketsHTML+=`<div class="ticket">Ticket ${i+1}: ${picks.map(n=>`<span class="ball" style="width:32px;height:32px;line-height:32px">${n}</span>`).join('')}</div>`;
  }
  document.getElementById('tickets').innerHTML=ticketsHTML;
  document.getElementById('status').innerText="Daily Analysis Done! "+new Date().toLocaleTimeString();
 },1200);
}
if('serviceWorker' in navigator){
 navigator.serviceWorker.register('service-worker.js');
}
</script>
</body>
  </html>
